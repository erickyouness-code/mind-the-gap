# À quoi ça sert
**To be** veut dire « être ». C'est le verbe le plus important de l'anglais : il sert à dire qui on est, comment on va, l'âge, le métier, la nationalité, où l'on se trouve.
! En anglais, on dit **I am 20** (« je suis 20 ») et non « j'ai 20 ans ». De même : **I am hungry** (j'ai faim), **I am cold** (j'ai froid), **I am right** (j'ai raison).
# Conjugaison
| Forme pleine | Contraction | Négation | Question
| I am | I'm | I'm not | Am I…?
| you are | you're | you aren't | Are you…?
| he / she / it is | he's / she's / it's | he isn't | Is he…?
| we are | we're | we aren't | Are we…?
| they are | they're | they aren't | Are they…?
= Sujet + am / is / are + complément
> I'm a student. | Je suis étudiant.
> She is 25 years old. | Elle a 25 ans.
> They aren't at home. | Ils ne sont pas à la maison.
> Are you tired? — Yes, I am. | Tu es fatigué ? — Oui.
# Réponses courtes
On répond avec **Yes, + sujet + verbe** ou **No, + sujet + verbe + not**. On ne contracte jamais une réponse courte positive : **Yes, I am** (jamais « Yes, I'm »).
> Is it cold? — No, it isn't. | Il fait froid ? — Non.
x I have 30 years. | I am 30 (years old).
x I am agree. | I agree.
? I ___ from France. => am/'m // Avec I, on utilise toujours am.
? My brother ___ a doctor. => is/'s // He / she / it / un nom singulier → is.
? We ___ late! Hurry up! => are/'re // We → are.
? ___ you hungry? => Are // Question : on inverse le verbe et le sujet.
* They ___ my friends. [is|am|are] => are // They → are.
* « J'ai froid » se dit : [I have cold|I am cold|I'm having cold] => I am cold // Les sensations physiques utilisent to be.
* Is she English? — No, she ___. [isn't|not|doesn't] => isn't // Réponse courte : No, she isn't.
* Quelle réponse courte est correcte ? [Yes, I'm.|Yes, I am.|Yes, am.] => Yes, I am. // Pas de contraction en fin de réponse courte positive.
`},{id:"pronouns-possessives",lv:1,title:"Pronoms et possessifs",en:"Pronouns & possessives",body:`
# Les pronoms personnels
| Sujet | Complément | Adj. possessif | Pronom possessif
| I (je) | me | my (mon, ma, mes) | mine (le mien)
| you (tu/vous) | you | your | yours
| he (il) | him | his | his
| she (elle) | her | her | hers
| it (il/elle, chose/animal) | it | its | —
| we (nous) | us | our | ours
| they (ils/elles) | them | their | theirs
! **It** s'utilise pour les objets et les animaux. Une table n'est ni masculine ni féminine en anglais.
# Le possessif s'accorde avec le possesseur
En français, « sa » s'accorde avec l'objet. En anglais, **his / her** dépend de la personne qui possède.
> Paul loves his mother. | Paul aime sa mère.
> Julie loves her father. | Julie aime son père.
> The dog is eating its food. | Le chien mange sa nourriture.
> This book is mine, not yours. | Ce livre est à moi, pas à toi.
x Julie and his brother | Julie and her brother
x it's tail (= it is) | its tail
? Marie is calling ___ mother. => her // Le possesseur est Marie (féminin) → her.
? Tom and Lisa love ___ new house. => their // Possesseurs pluriels → their.
? Can you help ___? I'm lost. => me // Pronom complément de I → me.
? That bag isn't hers, it's ___ (à moi). => mine // Pronom possessif de I → mine.
* The cat is licking ___ paws. [it's|its|his] => its // its = possessif ; it's = it is.
* I see ___ every day. (eux) [they|them|their] => them // Pronom complément → them.
* John lost ___ keys. [her|his|its] => his // John est un homme → his.
`},{id:"articles",lv:1,title:"Les articles a, an, the",en:"Articles",body:`
# A / An : un, une
On utilise **a** devant un son consonne et **an** devant un son voyelle. C'est le **son** qui compte, pas la lettre.
> a car, a dog, a university (/juː/) | une voiture, un chien, une université
> an apple, an egg, an hour (h muet) | une pomme, un œuf, une heure
# The : le, la, les
**The** est le même au singulier et au pluriel. On l'utilise quand on parle d'une chose précise, déjà connue ou unique.
> The sun is hot. | Le soleil est chaud.
> I bought a dress. The dress is red. | J'ai acheté une robe. La robe est rouge.
# Pas d'article (généralités)
Pour parler **en général**, l'anglais n'utilise pas d'article, alors que le français dit « le, la, les ».
> I love cats. | J'aime les chats.
> Life is beautiful. | La vie est belle.
> She plays tennis and speaks English. | Elle joue au tennis et parle anglais.
! Métiers : **She is a nurse** (elle est infirmière) — l'anglais exige « a ».
x I like the music. (en général) | I like music.
x He is teacher. | He is a teacher.
? She is ___ engineer. => an // engineer commence par un son voyelle.
? I need ___ umbrella. => an // umbrella commence par un son voyelle.
? It's ___ honour to meet you. => an // Le h de honour est muet.
* ___ dogs are loyal animals. (en général) [The|A|—] => — // Généralité au pluriel : pas d'article.
* He's ___ European citizen. [a|an|the] => a // European se prononce /jʊə/ : son consonne.
* Can you close ___ door, please? [a|the|—] => the // Une porte précise, connue de tous.
`},{id:"plurals",lv:1,title:"Le pluriel des noms",en:"Plural nouns",body:`
# Règle générale : + s
> a book → two books | un livre → deux livres
# Cas particuliers
| Terminaison | Règle | Exemple
| -s, -ss, -sh, -ch, -x, -o | + es | bus → buses, box → boxes, potato → potatoes
| consonne + y | y → ies | city → cities, baby → babies
| voyelle + y | + s | day → days, boy → boys
| -f / -fe | → ves | knife → knives, wife → wives, leaf → leaves
# Pluriels irréguliers
| Singulier | Pluriel
| man | men
| woman | women
| child | children
| person | people
| foot | feet
| tooth | teeth
| mouse | mice
| sheep / fish | sheep / fish
! **People** est déjà un pluriel : **people are**, jamais « people is ».
? one child, three ___ => children // Pluriel irrégulier.
? a city, two ___ => cities // consonne + y → ies.
? a knife, four ___ => knives // -fe → ves.
? a box, many ___ => boxes // -x → es.
* The people here ___ very friendly. [is|are] => are // people = pluriel.
* one foot, two ___ [foots|feet|feets] => feet // Pluriel irrégulier.
* a toy, some ___ [toies|toys] => toys // voyelle + y → s simplement.
`},{id:"present-simple",lv:1,title:"Le présent simple",en:"Present simple",tense:!0,body:`
# Quand l'utiliser
- Habitudes et routines : **I get up at 7.**
- Vérités générales : **Water boils at 100°C.**
- Goûts, opinions, états : **She likes jazz.**
- Horaires fixes : **The train leaves at 9.**
# Forme affirmative
= Sujet + verbe (base) — avec **-s** à la 3e personne (he / she / it)
| Sujet | Verbe
| I / you / we / they | work
| he / she / it | work**s**
> He works in a bank. | Il travaille dans une banque.
> My parents live in Lyon. | Mes parents habitent à Lyon.
Orthographe du -s : **go → goes, watch → watches, study → studies, have → has**.
# Négation et question : l'auxiliaire do / does
= Sujet + don't / doesn't + verbe (base)
= Do / Does + sujet + verbe (base) ?
> I don't eat meat. | Je ne mange pas de viande.
> She doesn't speak Spanish. | Elle ne parle pas espagnol.
> Do you like coffee? — Yes, I do. | Tu aimes le café ? — Oui.
> Where does he live? | Où habite-t-il ?
! Avec **does / doesn't**, le verbe perd son -s : **She doesn't work** (pas « doesn't works »).
# Mots-clés
**always, usually, often, sometimes, rarely, never, every day, on Mondays, once a week**
x She work in Paris. | She works in Paris.
x Does he likes it? | Does he like it?
x I am agree with you. | I agree with you.
? She ___ (watch) TV every evening. => watches // 3e personne + -ch → -es.
? My father ___ (not / drink) coffee. => doesn't drink/does not drink // Négation à la 3e personne → doesn't + base.
? ___ you speak English? => Do // Question avec you → Do.
? He ___ (study) medicine. => studies // consonne + y → ies.
? Where ___ your sister work? => does // 3e personne → does.
* The shop ___ at 9 a.m. every day. [open|opens|is opening] => opens // Horaire fixe, 3e personne.
* They ___ live here. [doesn't|don't|isn't] => don't // they → don't.
* Does she ___ chocolate? [likes|like|liking] => like // Après does : verbe à la base.
`},{id:"there-is",lv:1,title:"There is / There are",en:"There is / there are",body:`
# Il y a
**There is** (singulier) et **there are** (pluriel) traduisent « il y a » pour dire que quelque chose existe ou se trouve quelque part.
| | Singulier | Pluriel
| Affirmatif | There is (there's) a cat. | There are two cats.
| Négatif | There isn't a cat. | There aren't any cats.
| Question | Is there a cat? | Are there any cats?
> There's a bakery near my house. | Il y a une boulangerie près de chez moi.
> Are there any questions? | Y a-t-il des questions ?
> There were a lot of people. | Il y avait beaucoup de monde.
! Pour « il y a + durée » (passé), on utilise **ago** : **two years ago** = il y a deux ans.
x It has a problem. (il y a) | There is a problem.
? ___ a lot of tourists in summer. => There are // tourists = pluriel.
? ___ there a bank near here? => Is // Question au singulier.
? There ___ any milk in the fridge. => isn't/is not // milk est indénombrable → singulier.
* I met him three years ___. [ago|there are|before] => ago // « il y a + durée » = ago.
* ___ two bedrooms in my flat. [There is|There are|It has] => There are // Pluriel.
`},{id:"have-got",lv:1,title:"Have / have got (avoir)",en:"Have & have got",body:`
# Deux façons de dire « avoir »
**Have got** est très courant en anglais britannique ; **have** est universel.
| | have got | have
| Affirmatif | I've got a car. / She's got a car. | I have a car. / She has a car.
| Négatif | I haven't got a car. | I don't have a car.
| Question | Have you got a car? | Do you have a car?
> She's got blue eyes. | Elle a les yeux bleus.
> Do you have any brothers or sisters? | As-tu des frères et sœurs ?
# Have dans des expressions (sans got)
**have breakfast / lunch / dinner** (prendre le repas), **have a shower** (prendre une douche), **have a good time** (s'amuser), **have a look** (jeter un œil).
> We have lunch at noon. | Nous déjeunons à midi.
x I have got breakfast at 8. | I have breakfast at 8.
? He ___ got two sisters. => has/'s // he → has got.
? ___ you got a pen? => Have // Question avec have got.
? We don't ___ much time. => have // Négation avec do → have.
* She ___ a shower every morning. [has got|has|have] => has // Action/habitude : have sans got.
* I ___ any money. [haven't got|don't got|hasn't] => haven't got // Négatif de have got.
`},{id:"can",lv:1,title:"Can / can't (capacité, permission)",en:"Can",body:`
# Pouvoir, savoir faire
**Can** exprime la capacité (savoir faire), la possibilité et la permission. Il est invariable : pas de -s, pas de « to ».
= Sujet + can / can't + verbe (base)
> I can swim. | Je sais nager.
> She can't come tonight. | Elle ne peut pas venir ce soir.
> Can I open the window? | Je peux ouvrir la fenêtre ?
> Can you help me, please? | Peux-tu m'aider, s'il te plaît ?
# Au passé : could
> When I was five, I could read. | À cinq ans, je savais lire.
! Plus poli : **Could you…?** / **May I…?**
x He cans swim. | He can swim.
x I can to drive. | I can drive.
? She ___ (savoir) play the piano. => can // Capacité → can + base.
? I'm sorry, I ___ come to your party. => can't/cannot // Impossibilité → can't.
? When he was young, he ___ run very fast. => could // Capacité dans le passé → could.
* ___ I use your phone? [Can|Do|Am] => Can // Demande de permission.
* He can ___ three languages. [speaks|speak|to speak] => speak // can + base verbale.
`},{id:"questions",lv:1,title:"Poser des questions",en:"Questions & question words",body:`
# Les mots interrogatifs
| Anglais | Français
| What | Que / quoi / quel
| Who | Qui
| Where | Où
| When | Quand
| Why | Pourquoi
| How | Comment
| Which | Lequel / quel (choix limité)
| Whose | À qui
| How much / How many | Combien (indénombrable / dénombrable)
| How old / How long / How often | Quel âge / Combien de temps / À quelle fréquence
# La structure
= Mot interrogatif + auxiliaire + sujet + verbe ?
> Where do you live? | Où habites-tu ?
> What is your name? | Comment t'appelles-tu ?
> Why are you laughing? | Pourquoi tu ris ?
> How often do you go to the gym? | Tu vas à la salle tous les combien ?
! Quand **who / what** est le sujet, pas d'auxiliaire : **Who called you?** (Qui t'a appelé ?)
x Where you live? | Where do you live?
x How many money? | How much money?
? ___ do you get up? — At 7. => When/What time // On demande une heure.
? ___ is your favourite colour? => What // Quoi / quel.
? ___ old are you? => How // Âge → How old.
? ___ bag is this? — It's Tom's. => Whose // À qui ?
* How ___ sugar do you want? [many|much] => much // sugar est indénombrable.
* ___ wrote this book? [Who|Who did|Whom did] => Who // who est sujet : pas d'auxiliaire.
* Where ___ she work? [do|does|is] => does // 3e personne → does.
`},{id:"imperative",lv:1,title:"L'impératif",en:"Imperative",body:`
# Donner un ordre, un conseil, une instruction
On utilise le verbe à la base, sans sujet. Négation : **Don't + verbe**. Pour proposer : **Let's + verbe**.
> Open the door. | Ouvre / Ouvrez la porte.
> Don't touch that! | Ne touche pas à ça !
> Let's go to the beach. | Allons à la plage.
> Please sit down. | Asseyez-vous, je vous prie.
! Ajouter **please** rend la phrase beaucoup plus polie.
? ___ worry, everything will be fine. => Don't // Négation de l'impératif.
? ___ go to the cinema tonight! (allons) => Let's // Proposition → Let's.
* ___ the window, please. [Close|Closes|To close] => Close // Impératif = base verbale.
* ___ late tomorrow! [Not be|Don't be|Be not] => Don't be // Don't + base, même avec be.
`},{id:"prepositions-time-place",lv:1,title:"In, on, at (temps et lieu)",en:"Prepositions of time & place",body:`
# Le temps
| Préposition | Usage | Exemples
| at | heure précise, moments | at 6 o'clock, at night, at the weekend (UK), at Christmas
| on | jours, dates | on Monday, on 14 July, on my birthday
| in | mois, années, saisons, parties du jour | in May, in 2024, in summer, in the morning
> The meeting is at 10 on Friday. | La réunion est à 10 h vendredi.
> I was born in 1998. | Je suis né en 1998.
# Le lieu
| Préposition | Usage | Exemples
| at | un point, une adresse, un lieu d'activité | at the station, at home, at work, at school
| on | une surface, une ligne, un étage | on the table, on the wall, on the 3rd floor
| in | à l'intérieur, villes, pays | in the box, in London, in France
> She's at work. | Elle est au travail.
> The keys are on the table. | Les clés sont sur la table.
> I live in Paris. | J'habite à Paris.
! **in Paris** mais **at the airport** : une ville est un espace, un aéroport est un point de rendez-vous.
x I live at Paris. | I live in Paris.
x See you in Monday. | See you on Monday.
? My birthday is ___ June. => in // Mois → in.
? The film starts ___ 8:30. => at // Heure précise → at.
? I'll see you ___ Tuesday. => on // Jour → on.
? There's a picture ___ the wall. => on // Surface → on.
* She lives ___ Canada. [at|on|in] => in // Pays → in.
* I usually read ___ night. [in|at|on] => at // at night (expression fixe).
* We're meeting ___ the cinema. [at|on] => at // Lieu de rendez-vous → at.
`},{id:"demonstratives",lv:1,title:"This, that, these, those",en:"Demonstratives",body:`
# Proche ou éloigné ?
| | Proche (ici) | Éloigné (là-bas)
| Singulier | this (ce…-ci) | that (ce…-là)
| Pluriel | these (ces…-ci) | those (ces…-là)
> This is my brother. | Voici mon frère.
> I don't like those shoes. | Je n'aime pas ces chaussures-là.
> Who's that? | C'est qui, ça ?
! Au téléphone : **Hello, this is Anna.** (C'est Anna.)
? ___ apples here are delicious. => These // Proche + pluriel.
? Look at ___ bird over there! => that // Éloigné + singulier.
* I love ___ jeans you're wearing. [this|these|that] => these // jeans est pluriel.
* ___ houses on the hill are very old. [Those|That|This] => Those // Éloigné + pluriel.
`},{id:"possessive-s",lv:1,title:"Le cas possessif ('s)",en:"Possessive 's",body:`
# Exprimer l'appartenance
En anglais, on place le possesseur **avant** l'objet, avec **'s**.
= possesseur + 's + objet possédé
> Peter's car | la voiture de Peter
> my sister's room | la chambre de ma sœur
> my parents' house | la maison de mes parents (pluriel en -s → ' seul)
> the children's toys | les jouets des enfants (pluriel irrégulier → 's)
! Pour les objets, on préfère souvent **of** : **the end of the film**, **the top of the page**.
? the bike of Tom → ___ bike => Tom's // possesseur + 's.
? the room of my brothers → my ___ room => brothers' // pluriel en -s → '.
* the toys of the children [the children's toys|the childrens' toys] => the children's toys // children (pluriel irrégulier) + 's.
* « la fin du film » [the film's end|the end of the film] => the end of the film // Pour les choses, of est plus naturel.
`},{id:"present-continuous",lv:2,title:"Le présent continu (be + -ing)",en:"Present continuous",tense:!0,body:`
# Quand l'utiliser
- Action **en cours** au moment où l'on parle : **I'm cooking.** (Je suis en train de cuisiner.)
- Situation **temporaire** : **She's living with friends this month.**
- Projet **déjà organisé** dans le futur : **We're flying to Rome on Friday.**
- Changement en cours : **Prices are rising.**
= Sujet + am / is / are + verbe-ing
> What are you doing? — I'm reading. | Que fais-tu ? — Je lis.
> It isn't raining any more. | Il ne pleut plus.
> Are they coming tonight? | Ils viennent ce soir ?
# Orthographe du -ing
| Règle | Exemple
| e muet → on l'enlève | make → making, write → writing
| CVC accentué → double consonne | run → running, swim → swimming, stop → stopping
| -ie → -ying | lie → lying, die → dying
# Verbes d'état : pas de forme -ing
Les verbes qui expriment un état, un goût ou une pensée ne se mettent normalement pas à la forme continue : **know, like, love, hate, want, need, believe, understand, seem, own**.
x I am knowing the answer. | I know the answer.
x I'm wanting a coffee. | I want a coffee.
# Mots-clés
**now, right now, at the moment, currently, today, this week, Look! Listen!**
? Be quiet! The baby ___ (sleep). => is sleeping/'s sleeping // Action en cours.
? Look! It ___ (snow)! => is snowing/'s snowing // Look! → action en cours.
? They ___ (not / work) today. => aren't working/are not working // Négation au présent continu.
? ___ you ___ (listen) to me? => Are, listening // Structure : Are + sujet + -ing ?
* I ___ what you mean. [understand|am understanding] => understand // understand est un verbe d'état.
* He ___ (run) in the park right now. [runs|is runing|is running] => is running // run → running (double n).
`},{id:"simple-vs-continuous",lv:2,title:"Présent simple ou continu ?",en:"Present simple vs continuous",tense:!0,body:`
# La différence clé
| Présent simple | Présent continu
| habitude, vérité, permanent | en ce moment, temporaire
| I work in Lyon. | I'm working in Paris this month.
| He usually drives to work. | Today he's taking the bus.
| What do you do? (ton métier) | What are you doing? (maintenant)
> She plays the guitar, but she isn't playing now. | Elle joue de la guitare, mais elle n'en joue pas en ce moment.
! Certains verbes changent de sens : **I think it's good** (opinion) / **I'm thinking about it** (réflexion en cours). **I have a car** (possession) / **I'm having lunch** (action).
? Water ___ (boil) at 100 degrees. => boils // Vérité générale.
? Shh! I ___ (talk) on the phone. => am talking/'m talking // En ce moment.
? He usually ___ (wear) jeans, but today he ___ (wear) a suit. => wears, is wearing/wears, 's wearing // Habitude / aujourd'hui.
* What ___ for a living? — I'm a nurse. [are you doing|do you do] => do you do // Question sur le métier → présent simple.
* I ___ about moving to Canada. [think|'m thinking] => 'm thinking // Réflexion en cours.
* She ___ two cars. [has|is having] => has // Possession : verbe d'état.
`},{id:"past-be",lv:2,title:"Was / were (passé de « to be »)",en:"Past of be",tense:!0,body:`
| Affirmatif | Négatif | Question
| I / he / she / it was | wasn't | Was I / he…?
| you / we / they were | weren't | Were you…?
> I was tired yesterday. | J'étais fatigué hier.
> We weren't at home. | Nous n'étions pas à la maison.
> Where were you last night? | Où étais-tu hier soir ?
> There was a problem. / There were many people. | Il y avait un problème. / Il y avait beaucoup de monde.
? I ___ at the cinema last night. => was // I → was.
? They ___ very happy. => were // they → were.
? ___ she at work yesterday? => Was // Question, she → Was.
* There ___ a lot of cars on the road. [was|were] => were // cars = pluriel.
* You ___ late this morning. [wasn't|weren't] => weren't // you → were / weren't.
`},{id:"past-simple",lv:2,title:"Le prétérit (past simple)",en:"Past simple",tense:!0,body:`
# Quand l'utiliser
Pour une action **terminée** dans le passé, à un moment **précis ou connu**. Il correspond au passé composé et au passé simple français.
> I visited London last year. | J'ai visité Londres l'année dernière.
> She called me two hours ago. | Elle m'a appelé il y a deux heures.
# Verbes réguliers : + ed
| Règle | Exemple
| règle générale | work → worked, play → played
| e final → + d | live → lived
| consonne + y → ied | study → studied
| CVC accentué → double | stop → stopped, plan → planned
# Verbes irréguliers
Il faut les apprendre ! **go → went, see → saw, buy → bought, eat → ate, take → took…** (voir la liste complète dans la section Verbes irréguliers).
# Négation et question : did
= Sujet + didn't + verbe (base)
= (Mot interrogatif) + Did + sujet + verbe (base) ?
> I didn't see him. | Je ne l'ai pas vu.
> Did you go out last night? — No, I didn't. | Tu es sorti hier soir ? — Non.
> What did she say? | Qu'est-ce qu'elle a dit ?
! Après **did / didn't**, le verbe revient à la base : **Did you go?** (pas « Did you went? »).
# Prononciation de -ed
| Son | Après | Exemples
| /t/ | p, k, f, s, sh, ch | stopped, worked, laughed, washed
| /d/ | sons voisés et voyelles | played, lived, called
| /ɪd/ | t, d | wanted, needed, decided
# Mots-clés
**yesterday, last week / month / year, ago, in 2010, when I was young**
x I didn't went. | I didn't go.
x Did she called you? | Did she call you?
? We ___ (watch) a great film last night. => watched // Régulier : + ed.
? She ___ (go) to Spain in 2019. => went // go → went.
? I ___ (not / see) the news. => didn't see/did not see // didn't + base.
? ___ you ___ (enjoy) the party? => Did, enjoy // Did + sujet + base.
? He ___ (buy) a new phone yesterday. => bought // buy → bought.
? They ___ (stop) the car. => stopped // CVC → double consonne.
* Where ___ you go on holiday? [did|were|do] => did // Question au passé → did.
* « wanted » se prononce avec un son… [/t/|/d/|/ɪd/] => /ɪd/ // Après t ou d → /ɪd/.
* I ___ him yesterday. [meet|met|meeted] => met // meet → met (irrégulier).
`},{id:"future-will-going",lv:2,title:"Le futur : will ou be going to ?",en:"Will vs be going to",tense:!0,body:`
# Will
= Sujet + will ('ll) + verbe (base) — négation : won't
- Décision prise **sur le moment** : **I'm thirsty. — I'll get you some water.**
- Prédiction basée sur une **opinion** : **I think it will rain tomorrow.**
- Promesse, offre, refus : **I'll help you. / I won't tell anyone.**
> I'll call you later. | Je t'appellerai plus tard.
> She won't be happy. | Elle ne sera pas contente.
# Be going to
= Sujet + am / is / are + going to + verbe (base)
- **Intention** déjà décidée : **I'm going to learn Japanese next year.**
- Prédiction basée sur une **preuve visible** : **Look at those clouds! It's going to rain.**
> We're going to buy a house. | Nous allons acheter une maison.
> Be careful, you're going to fall! | Attention, tu vas tomber !
! Le présent continu sert aussi pour les **rendez-vous fixés** : **I'm meeting Sam at 6.**
? The phone is ringing. — OK, I ___ answer it. => 'll/will // Décision immédiate.
? I've decided: I ___ (go) to study abroad. => am going to go/'m going to go/am going to/'m going to // Intention déjà décidée.
? Don't worry, I ___ (not / tell) anybody. => won't tell/will not tell // Promesse → won't.
* Look at that car! It ___ crash! [will|is going to] => is going to // Preuve visible.
* I think Brazil ___ win the World Cup. [will|is going to] => will // Opinion → will.
* « Je vais t'aider » (offre spontanée) [I'll help you.|I help you.] => I'll help you. // Offre spontanée → will.
`},{id:"comparatives",lv:2,title:"Comparatifs et superlatifs",en:"Comparatives & superlatives",body:`
# Formation
| Adjectif | Comparatif | Superlatif
| court (1 syllabe) : tall | taller (than) | the tallest
| en -y : happy | happier | the happiest
| CVC : big | bigger | the biggest
| long (2+ syllabes) : expensive | more expensive | the most expensive
| good | better | the best
| bad | worse | the worst
| far | farther / further | the farthest / furthest
> My brother is taller than me. | Mon frère est plus grand que moi.
> It's the most beautiful city in the world. | C'est la plus belle ville du monde.
# Égalité et infériorité
> She's as tall as her mother. | Elle est aussi grande que sa mère.
> This film isn't as good as the book. | Ce film n'est pas aussi bon que le livre.
> This one is less expensive. | Celui-ci est moins cher.
# Plus… plus…
> The more you practise, the better you get. | Plus tu t'entraînes, plus tu progresses.
x more big | bigger
x the most good | the best
x in the world's (superlatif + of / in) | the best restaurant in town
? This exercise is ___ (easy) than the last one. => easier // easy → easier.
? Everest is ___ (high) mountain in the world. => the highest // Superlatif court.
? Today is ___ (bad) day of my life! => the worst // bad → worst.
? Gold is ___ (expensive) than silver. => more expensive // Adjectif long.
* He runs as fast ___ me. [than|as|that] => as // as … as.
* The ___ you sleep, the more tired you feel. [less|least|fewer] => less // the less… the more.
`},{id:"countables",lv:2,title:"Some, any, much, many, a lot of",en:"Countable & uncountable",body:`
# Dénombrable ou indénombrable ?
**Dénombrables** : on peut les compter (an apple, two apples). **Indénombrables** : pas de pluriel, pas de « a » : **water, money, bread, advice, information, news, furniture, luggage, homework**.
! Pièges pour les francophones : **information, advice, news, furniture, luggage** sont indénombrables : **some advice** (des conseils), **a piece of advice** (un conseil).
| | Dénombrable | Indénombrable
| beaucoup (négatif / question) | many | much
| beaucoup (affirmatif courant) | a lot of / lots of | a lot of / lots of
| peu | few / a few | little / a little
| combien ? | How many…? | How much…?
# Some / any
**Some** : phrases affirmatives et offres / demandes. **Any** : négations et questions.
> There's some milk in the fridge. | Il y a du lait dans le frigo.
> Do you have any brothers? | As-tu des frères ?
> Would you like some tea? | Voulez-vous du thé ?
> I don't have any money. | Je n'ai pas d'argent.
# A few / few, a little / little
**a few / a little** = un peu, quelques-uns (positif) ; **few / little** = peu (négatif).
x an information, informations | some information, a piece of information
x How much people? | How many people?
? I don't have ___ time. => much/any // Négation + indénombrable.
? How ___ brothers have you got? => many // brothers est dénombrable.
? Can you give me ___ advice? => some // advice est indénombrable ; demande → some.
? There were very ___ people at the concert, it was almost empty. => few // peu (sens négatif) + dénombrable.
* She has ___ friends in London, so she's never lonely. [a few|few|a little] => a few // Quelques (positif).
* Is there ___ sugar left? [some|any|many] => any // Question → any.
* I need ___ information about the hotel. [an|some|many] => some // information est indénombrable.
`},{id:"frequency-adverbs",lv:2,title:"Adverbes de fréquence",en:"Adverbs of frequency",body:`
| 100 % → 0 % | Français
| always | toujours
| usually | d'habitude
| often | souvent
| sometimes | parfois
| rarely / seldom | rarement
| never | jamais
# Place dans la phrase
L'adverbe se place **avant le verbe principal** mais **après to be**.
> I usually get up early. | Je me lève généralement tôt.
> She is always late. | Elle est toujours en retard.
> We have never been to Japan. | Nous ne sommes jamais allés au Japon.
x I go always to school by bus. | I always go to school by bus.
? (often) He plays football. → He ___ football. => often plays // Avant le verbe principal.
? (never) She is late. → She ___ late. => is never // Après be.
* I ___ breakfast. [eat never|never eat|never eats] => never eat // Avant le verbe.
* They ___ happy. [are always|always are] => are always // Après be.
`},{id:"obligation",lv:2,title:"Must, have to, should",en:"Obligation & advice",body:`
| Modal | Sens | Exemple
| must | obligation personnelle / forte | I must call my mum.
| have to | obligation extérieure (règle) | I have to wear a uniform.
| mustn't | interdiction | You mustn't smoke here.
| don't have to | absence d'obligation | You don't have to come.
| should / shouldn't | conseil | You should see a doctor.
> You must be home by midnight. | Tu dois être rentré avant minuit.
> She has to work on Saturdays. | Elle doit travailler le samedi.
> We don't have to pay; it's free. | On n'est pas obligés de payer, c'est gratuit.
> You shouldn't eat so much sugar. | Tu ne devrais pas manger autant de sucre.
! **mustn't** ≠ **don't have to** ! « You mustn't go » = tu ne dois pas y aller (interdit) ; « You don't have to go » = tu n'es pas obligé.
! Au passé : **had to** (I had to leave early). Must n'a pas de passé.
? You ___ smoke in the hospital. It's forbidden. => mustn't/must not // Interdiction.
? Tomorrow is Sunday, so I ___ get up early. (pas obligé) => don't have to/do not have to // Absence d'obligation.
? You look tired. You ___ go to bed. => should // Conseil.
? Yesterday I ___ (devoir) work late. => had to // Passé de must / have to.
* She ___ wear glasses to drive. It's the law. [has to|should|mustn't] => has to // Obligation extérieure (loi).
* You ___ tell her. It's a secret! [don't have to|mustn't] => mustn't // Interdiction.
`},{id:"object-pronouns-reflexive",lv:2,title:"Pronoms réfléchis et réciproques",en:"Reflexive pronouns",body:`
| Sujet | Réfléchi
| I | myself
| you | yourself / yourselves
| he / she / it | himself / herself / itself
| we | ourselves
| they | themselves
> I cut myself. | Je me suis coupé.
> She made the cake herself. | Elle a fait le gâteau elle-même.
> They looked at each other. | Ils se sont regardés (l'un l'autre).
! Beaucoup de verbes pronominaux français ne le sont pas en anglais : **se lever = get up, se souvenir = remember, se sentir = feel, se dépêcher = hurry, se marier = get married**.
x I feel myself tired. | I feel tired.
x We met ourselves yesterday. | We met yesterday.
? Did you enjoy ___ at the party? (you singulier) => yourself // Réfléchi de you (singulier).
? He hurt ___ playing football. => himself // Réfléchi de he.
* Paul and Anna love ___. (l'un l'autre) [themselves|each other] => each other // Réciproque.
* « Je me lève à 7 h » [I get up at 7.|I get myself up at 7.] => I get up at 7. // get up n'est pas pronominal.
`},{id:"present-cont-future",lv:2,title:"Exprimer le futur avec le présent",en:"Present for future",tense:!0,body:`
# Présent continu = rendez-vous organisé
> I'm seeing the dentist on Monday. | Je vais chez le dentiste lundi.
> What are you doing this weekend? | Qu'est-ce que tu fais ce week-end ?
# Présent simple = horaire officiel
> The plane takes off at 6:45. | L'avion décolle à 6 h 45.
> The course starts next Monday. | Le cours commence lundi prochain.
# Après when, as soon as, before, after, until : présent (pas will)
> I'll call you when I arrive. | Je t'appellerai quand j'arriverai.
x When I will arrive, I'll call you. | When I arrive, I'll call you.
? I'll tell him as soon as he ___ (get) home. => gets // Après as soon as → présent.
? We ___ (have) dinner with Tom tonight — it's booked. => are having/'re having // Rendez-vous organisé.
* The train ___ at 10:15 tomorrow. [leaves|will leaving] => leaves // Horaire → présent simple.
* Wait here until I ___ back. [come|will come] => come // Après until → présent.
`},{id:"prepositions-movement",lv:2,title:"Prépositions de mouvement",en:"Prepositions of movement",body:`
| Préposition | Sens | Exemple
| to | vers, à | I go to work by bus.
| into / out of | dans / hors de | She ran into the room.
| across | en traversant (une surface) | We walked across the bridge.
| through | à travers (un volume) | The train goes through the tunnel.
| along | le long de | Walk along the river.
| up / down | en montant / descendant | He climbed up the hill.
| past | devant (en passant) | Go past the church.
| over / under | par-dessus / sous | The cat jumped over the wall.
| towards | en direction de | He walked towards me.
! **go home** : pas de « to » devant home. Et **arrive in** (ville) / **arrive at** (lieu précis), jamais « arrive to ».
x I go to home. | I go home.
? We arrived ___ London at midnight. => in // arrive in + ville.
? The thief climbed ___ the window. => through // à travers.
* She swam ___ the lake. [across|through|along] => across // D'une rive à l'autre.
* Get ___ the car! (sors) [out of|out|off] => out of // out of + lieu.
`},{id:"adjectives-adverbs",lv:2,title:"Adjectifs et adverbes (-ly)",en:"Adjectives vs adverbs",body:`
# L'adjectif décrit un nom, l'adverbe décrit une action
> She is a careful driver. → She drives carefully. | C'est une conductrice prudente → Elle conduit prudemment.
| Adjectif | Adverbe
| quick | quickly
| easy | easily
| good | **well**
| fast | fast
| hard | hard (hardly = à peine !)
| late | late (lately = récemment)
# Place de l'adjectif
L'adjectif se place **avant le nom** et ne s'accorde jamais : **a red car, two red cars**.
# Adjectifs en -ed / -ing
**-ed** = ce qu'on ressent ; **-ing** = ce qui provoque le sentiment.
> I'm bored. This film is boring. | Je m'ennuie. Ce film est ennuyeux.
> She was surprised by the surprising news. | Elle a été surprise par cette nouvelle surprenante.
x She speaks English very good. | She speaks English very well.
x a car red / reds cars | a red car / red cars
x I'm boring. (= je suis ennuyeux !) | I'm bored.
? He plays the piano very ___ (good). => well // Adverbe de good → well.
? Please drive ___ (slow). => slowly // Adverbe → slowly.
? The lesson was very ___ (interest). => interesting // Ce qui provoque l'intérêt.
? I'm ___ (tire). I need to sleep. => tired // Ce que je ressens.
* She works very ___. [hard|hardly] => hard // hardly = à peine.
* I was really ___ by the end of the film. [confusing|confused] => confused // Sentiment ressenti → -ed.
`}],es=[{id:"past-continuous",lv:3,title:"Le passé continu (was / were + -ing)",en:"Past continuous",tense:!0,body:`
# Quand l'utiliser
- Action **en cours** à un moment précis du passé : **At 8 p.m. I was having dinner.**
- Décor d'une histoire, interrompu par une action courte (prétérit) : **I was walking home when it started to rain.**
- Deux actions longues simultanées : **While I was cooking, he was watching TV.**
Il correspond souvent à l'**imparfait** français.
= Sujet + was / were + verbe-ing
> What were you doing at midnight? | Que faisais-tu à minuit ?
> She wasn't listening. | Elle n'écoutait pas.
> The phone rang while I was taking a shower. | Le téléphone a sonné pendant que je prenais une douche.
! **when** + action courte (prétérit) ; **while** + action longue (continu).
x When I was arriving, he left. | When I arrived, he was leaving.
? I ___ (sleep) when you called. => was sleeping // Action en cours interrompue.
? They ___ (play) football when it started to rain. => were playing // Action longue + interruption.
? What ___ you ___ (do) at 10 last night? => were, doing // were + sujet + -ing.
* While she ___, the baby woke up. [cooked|was cooking] => was cooking // while + action longue.
* I ___ my keys while I was running. [was losing|lost] => lost // Action courte → prétérit.
`},{id:"present-perfect",lv:3,title:"Le present perfect (have + participe passé)",en:"Present perfect simple",tense:!0,body:`
# Le lien passé–présent
Le present perfect relie le passé au **présent**. On ne précise **pas quand** l'action a eu lieu.
= Sujet + have / has + participe passé
- **Expérience** de vie : **I have been to Japan.** (Je suis déjà allé au Japon.)
- Action passée avec un **résultat présent** : **I've lost my keys.** (je ne les ai plus)
- Situation qui **dure jusqu'à maintenant** (avec for / since) : **I've lived here for ten years.**
> Have you ever eaten sushi? | As-tu déjà mangé des sushis ?
> She has just left. | Elle vient de partir.
> I haven't finished yet. | Je n'ai pas encore fini.
# Mots-clés
| Mot | Sens | Place
| ever | déjà (question) / jamais | avant le participe
| never | jamais | avant le participe
| just | venir de | avant le participe
| already | déjà | avant le participe
| yet | encore (nég.) / déjà (question) | en fin de phrase
| for | depuis + durée | for two years
| since | depuis + point de départ | since 2015, since Monday
! **Depuis** se traduit par le present perfect, pas par le présent : **I've known her for years** (je la connais depuis des années).
x I live here since 2010. | I've lived here since 2010.
x I know him for five years. | I've known him for five years.
? I ___ (never / see) the sea. => have never seen/'ve never seen // Expérience → have + never + participe.
? She ___ (just / finish) her homework. => has just finished/'s just finished // Résultat récent.
? We've lived in Nantes ___ 2018. => since // Point de départ → since.
? They've been married ___ twenty years. => for // Durée → for.
? Have you finished ___? => yet // yet en fin de question.
* ___ you ever ___ to Canada? [Did / go|Have / been|Have / went] => Have / been // Expérience → present perfect.
* I've known Tom ___ we were children. [for|since|during] => since // Point de départ.
`},{id:"perfect-vs-past",lv:3,title:"Present perfect ou prétérit ?",en:"Present perfect vs past simple",tense:!0,body:`
# La question à se poser : QUAND ?
| Prétérit | Present perfect
| moment **précis / terminé** | moment **non précisé** / période non terminée
| I saw him yesterday. | I've seen him (récemment, peu importe quand).
| I went to Rome in 2019. | I've been to Rome twice.
| She worked there for 5 years (elle n'y travaille plus). | She has worked there for 5 years (elle y travaille encore).
> I lost my phone last week. | J'ai perdu mon téléphone la semaine dernière.
> I've lost my phone. Can you call it? | J'ai perdu mon téléphone. Tu peux l'appeler ?
! Avec **yesterday, last…, ago, in 2010, when…** → toujours le **prétérit**.
! **this morning** : present perfect s'il est encore le matin, prétérit si c'est l'après-midi.
x I have seen him yesterday. | I saw him yesterday.
x When have you arrived? | When did you arrive?
? I ___ (visit) Spain three times. => have visited/'ve visited // Nombre de fois, sans date → present perfect.
? I ___ (visit) Spain in 2015. => visited // Date précise → prétérit.
? ___ you ___ (see) Anna yesterday? => Did, see // yesterday → prétérit.
? Shakespeare ___ (write) many plays. => wrote // Personne décédée : période terminée.
* I ___ my homework. Can I go out now? [finished|have finished] => have finished // Résultat présent.
* When ___ you ___ to London? [have / moved|did / move] => did / move // Question When → prétérit.
`},{id:"present-perfect-continuous",lv:3,title:"Le present perfect continu",en:"Present perfect continuous",tense:!0,body:`
= Sujet + have / has been + verbe-ing
- Insiste sur la **durée** d'une action qui continue : **I've been waiting for an hour!**
- Action récente avec des **traces visibles** : **You're out of breath. Have you been running?**
> It has been raining all day. | Il pleut depuis ce matin / toute la journée.
> How long have you been learning English? | Depuis combien de temps apprends-tu l'anglais ?
# Simple ou continu ?
| Present perfect simple | Present perfect continu
| résultat, quantité | durée, activité
| I've written three emails. | I've been writing emails all morning.
! Les verbes d'état (know, like, be…) restent au simple : **I've known her for years.**
? I'm tired. I ___ (work) all day. => have been working/'ve been working // Durée, activité.
? How long ___ you ___ (wait)? => have, been waiting // How long + continu.
? She ___ (read) four books this month. => has read/'s read // Quantité → simple.
* Your eyes are red. ___ ? [Have you cried|Have you been crying] => Have you been crying // Traces visibles.
* I ___ him since 2010. [have been knowing|have known] => have known // know = verbe d'état.
`},{id:"used-to",lv:3,title:"Used to / would (habitudes passées)",en:"Used to & would",body:`
= Sujet + used to + verbe (base)
**Used to** décrit une habitude ou un état **passé qui n'existe plus**. Souvent traduit par l'imparfait.
> I used to smoke, but I stopped. | Je fumais, mais j'ai arrêté.
> Did you use to play tennis? | Tu jouais au tennis avant ?
> There used to be a cinema here. | Il y avait un cinéma ici avant.
# Would (actions répétées, récit)
> When I was a child, we would go to the beach every Sunday. | Enfant, nous allions à la plage chaque dimanche.
! **would** ne s'utilise pas pour les états : **I used to have long hair** (pas « I would have long hair »).
# Attention : be / get used to + -ing
**be used to doing** = être habitué à ; **get used to doing** = s'habituer à.
> I'm used to getting up early. | J'ai l'habitude de me lever tôt.
> You'll get used to driving on the left. | Tu t'habitueras à conduire à gauche.
? I ___ live in Paris, but now I live in Lyon. => used to // Situation passée terminée.
? Did you ___ have a pet? => use to // Après did → use to.
? She's used to ___ (work) at night. => working // be used to + -ing.
* We ___ have a dog when I was young. [used to|would|use to] => used to // État/possession passée.
* I can't get used to ___ in this noise. [sleep|sleeping] => sleeping // get used to + -ing.
`},{id:"conditionals-0-1",lv:3,title:"Conditionnels 0 et 1 (if + présent)",en:"Zero & first conditional",tense:!0,body:`
# Conditionnel 0 : vérités générales
= If + présent, présent
> If you heat ice, it melts. | Si on chauffe de la glace, elle fond.
# Conditionnel 1 : situation réelle / probable
= If + présent, will + verbe (base)
> If it rains, we'll stay at home. | S'il pleut, nous resterons à la maison.
> If you don't hurry, you'll miss the bus. | Si tu ne te dépêches pas, tu vas rater le bus.
> I'll call you if I need help. | Je t'appellerai si j'ai besoin d'aide.
! Jamais de **will** après **if** (comme en français : « si j'ai » et pas « si j'aurai »).
# Unless = if… not
> You won't pass unless you study. | Tu ne réussiras pas à moins de travailler.
x If it will rain, I'll stay home. | If it rains, I'll stay home.
? If you ___ (mix) red and blue, you get purple. => mix // Vérité générale → présent.
? If I ___ (see) him, I'll tell him. => see // Après if → présent.
? We ___ (go) to the beach if the weather is nice. => will go/'ll go // Conséquence → will.
* ___ you work harder, you won't succeed. [If|Unless|When] => Unless // unless = if not.
* If she ___ late again, she'll lose her job. [is|will be] => is // Pas de will après if.
`},{id:"conditional-2",lv:3,title:"Conditionnel 2 (if + prétérit)",en:"Second conditional",tense:!0,body:`
# Situation imaginaire ou peu probable (présent / futur)
= If + prétérit, would + verbe (base)
> If I won the lottery, I would travel around the world. | Si je gagnais au loto, je ferais le tour du monde.
> If I had more time, I'd learn the guitar. | Si j'avais plus de temps, j'apprendrais la guitare.
> What would you do if you saw a ghost? | Que ferais-tu si tu voyais un fantôme ?
# If I were you (conseil)
Avec be, on utilise souvent **were** pour toutes les personnes.
> If I were you, I'd accept the offer. | À ta place, j'accepterais l'offre.
! Comme en français : **si + imparfait → conditionnel**. Jamais de would après if.
x If I would have money, I would buy it. | If I had money, I would buy it.
? If I ___ (be) rich, I'd buy a house in Italy. => were/was // If + prétérit (were est plus soutenu).
? She ___ (help) you if she had time. => would help/'d help // Conséquence → would.
? If we ___ (live) by the sea, we'd go swimming every day. => lived // If + prétérit.
* If I ___ you, I'd see a doctor. [am|were|would be] => were // If I were you.
* What ___ you do if you lost your job? [will|would] => would // Hypothèse → would.
`},{id:"passive-basic",lv:3,title:"La voix passive",en:"Passive voice",tense:!0,body:`
# Formation
= Sujet + be (au temps voulu) + participe passé (+ by + agent)
On utilise le passif quand l'action est plus importante que celui qui la fait, ou quand on ne le connaît pas. Souvent traduit par **« on »** en français.
| Temps | Actif | Passif
| Présent | They make cars here. | Cars are made here.
| Prétérit | Someone stole my bike. | My bike was stolen.
| Present perfect | They have built a bridge. | A bridge has been built.
| Futur | They will open a shop. | A shop will be opened.
| Modal | You must do it. | It must be done.
> English is spoken all over the world. | On parle anglais partout dans le monde.
> The Mona Lisa was painted by Leonardo da Vinci. | La Joconde a été peinte par Léonard de Vinci.
> I was told that the shop was closed. | On m'a dit que le magasin était fermé.
x I was explained the problem. | The problem was explained to me.
? This house ___ (build) in 1850. => was built // Prétérit passif.
? Rice ___ (grow) in China. => is grown // Présent passif.
? The thief ___ (arrest) yesterday. => was arrested // Prétérit passif.
? The results ___ (publish) next week. => will be published // Futur passif.
* « On m'a volé mon portefeuille » [My wallet was stolen.|My wallet stole.] => My wallet was stolen. // on → passif.
* The emails have ___ sent. [be|been|being] => been // have been + participe.
`},{id:"gerund-infinitive",lv:3,title:"Gérondif ou infinitif ?",en:"Gerund vs infinitive",body:`
# Verbe + -ing
Après **enjoy, finish, mind, avoid, suggest, keep, consider, practise, miss, can't stand, give up, look forward to**, et après une préposition.
> I enjoy reading. | J'aime lire.
> She's good at drawing. | Elle est douée en dessin.
> I'm looking forward to seeing you. | J'ai hâte de te voir.
# Verbe + to + base
Après **want, decide, hope, plan, learn, need, promise, refuse, agree, afford, manage, would like**.
> I want to go home. | Je veux rentrer.
> They decided to move. | Ils ont décidé de déménager.
# Les deux, avec un changement de sens
| Verbe | + -ing | + to
| stop | arrêter de faire (I stopped smoking) | s'arrêter pour faire (I stopped to smoke)
| remember | se souvenir d'avoir fait | penser à faire
| try | essayer (pour voir) | s'efforcer de
! Le gérondif peut être **sujet** : **Swimming is good for you.** (Nager, c'est bon pour la santé.)
x I enjoy to dance. | I enjoy dancing.
x I look forward to see you. | I look forward to seeing you.
? I've finished ___ (write) the report. => writing // finish + -ing.
? She decided ___ (study) law. => to study // decide + to.
? Do you mind ___ (open) the window? => opening // mind + -ing.
? Remember ___ (lock) the door when you leave! => to lock // Penser à faire.
* He stopped ___ to answer the phone. (s'est arrêté pour) [walking|to walk] => walking // stop + -ing : il a arrêté de marcher pour répondre.
* I can't afford ___ a new car. [buying|to buy] => to buy // afford + to.
`},{id:"relative-clauses",lv:3,title:"Les propositions relatives",en:"Relative clauses",body:`
| Pronom | Pour | Exemple
| who | personnes | The man who lives next door is a pilot.
| which | choses, animaux | The car which I bought is red.
| that | personnes ou choses (relative essentielle) | The film that we saw was great.
| whose | possession (dont) | The girl whose bag was stolen…
| where | lieu (où) | The town where I grew up…
| when | temps (où) | The day when we met…
> She's the woman who helped me. | C'est la femme qui m'a aidé.
> This is the book (that) I told you about. | Voici le livre dont je t'ai parlé.
# Omettre le pronom
Quand le pronom est **complément** (pas sujet), on peut l'omettre : **The man (who) I met** / **The film (that) we watched**.
# Relatives non essentielles (avec virgules)
Elles ajoutent une info. On n'utilise jamais **that** et on ne peut pas omettre le pronom.
> My brother, who lives in Berlin, is an architect. | Mon frère, qui vit à Berlin, est architecte.
x The man which… | The man who…
x My car, that is old, … | My car, which is old, …
? That's the hotel ___ we stayed last year. => where // Lieu.
? I have a friend ___ father is a famous singer. => whose // Possession.
? The people ___ live upstairs are noisy. => who/that // Personnes, sujet.
* Paris, ___ is the capital of France, is beautiful. [that|which|who] => which // Relative non essentielle → which.
* The pizza ___ we ordered was cold. [who|which|where] => which // Chose.
`},{id:"modals-possibility",lv:3,title:"May, might, could (possibilité)",en:"Modals of possibility",body:`
| Modal | Certitude | Exemple
| will | ~100 % | She will be there.
| must | quasi certain (déduction) | He must be tired after that trip.
| may | possible (~50 %) | It may rain later.
| might / could | possible (moins sûr) | She might come, I don't know.
| can't | impossible (déduction) | That can't be true!
> He may be at home. | Il est peut-être chez lui.
> We might go to Spain this summer. | On ira peut-être en Espagne cet été.
> You must be joking! | Tu plaisantes !
! Le contraire de **must** (déduction) est **can't**, pas « mustn't ».
? Take an umbrella. It ___ rain. => may/might/could // Possibilité.
? She's been working for 12 hours. She ___ be exhausted. => must // Déduction quasi certaine.
? That ___ be Tom — he's in Australia! => can't/cannot // Impossibilité.
* I'm not sure. I ___ go to the party. [must|might|can't] => might // Incertitude.
* He has three Ferraris. He ___ be very rich. [must|can't|might not] => must // Déduction logique.
`},{id:"question-tags",lv:3,title:"Les question tags",en:"Question tags",body:`
# « …n'est-ce pas ? »
On reprend l'**auxiliaire** et le **pronom**. Phrase affirmative → tag négatif ; phrase négative → tag affirmatif.
> You're French, aren't you? | Tu es français, n'est-ce pas ?
> She doesn't eat meat, does she? | Elle ne mange pas de viande, si ?
> They went home, didn't they? | Ils sont rentrés, non ?
> You can swim, can't you? | Tu sais nager, hein ?
# Cas particuliers
**I am → aren't I?** · **Let's → shall we?** · Impératif → **will you?**
> I'm late, aren't I? | Je suis en retard, non ?
> Let's go, shall we? | On y va ?
? It's cold today, ___? => isn't it // is → isn't it.
? You live in Lyon, ___? => don't you // présent simple → do.
? She hasn't called, ___? => has she // Négatif → tag positif.
? He went to the party, ___? => didn't he // Prétérit → did.
* I'm right, ___? [amn't I|aren't I|am I not] => aren't I // Exception : aren't I.
* Let's have a break, ___? [shall we|will we|don't we] => shall we // Let's → shall we.
`},{id:"reported-requests-say-tell",lv:3,title:"Say ou tell ? Make ou do ?",en:"Say/tell, make/do",body:`
# Say / tell
**Tell** est suivi de la personne : **tell someone something**. **Say** est suivi de ce qui est dit : **say something (to someone)**.
> She told me the truth. | Elle m'a dit la vérité.
> He said that he was tired. | Il a dit qu'il était fatigué.
> He said hello to me. | Il m'a dit bonjour.
Expressions avec tell : **tell the truth, tell a lie, tell a story, tell a joke, tell the time**.
# Make / do
**Make** = créer, fabriquer, produire. **Do** = activité, tâche, travail.
| make | do
| make a cake, make a mistake | do homework, do the housework
| make a decision, make money | do business, do exercise
| make a noise, make friends | do your best, do a favour
| make a phone call, make the bed | do the dishes, do the shopping
x She said me… | She told me… / She said to me…
x I did a mistake. | I made a mistake.
? Can you ___ me a favour? => do // do a favour.
? He ___ a lot of mistakes in his test. => made // make a mistake.
? Don't ___ lies! => tell // tell a lie.
? She ___ that she was hungry. => said // say + ce qui est dit.
* I need to ___ a decision. [do|make] => make // make a decision.
* Could you ___ me the way to the station? [say|tell] => tell // tell + personne.
`},{id:"past-perfect",lv:4,title:"Le plus-que-parfait (past perfect)",en:"Past perfect simple & continuous",tense:!0,body:`
# Le passé du passé
= Sujet + had + participe passé
On l'utilise pour une action **antérieure** à une autre action passée. C'est le plus-que-parfait français.
> When I arrived, the film had already started. | Quand je suis arrivé, le film avait déjà commencé.
> She had never seen snow before she moved to Canada. | Elle n'avait jamais vu la neige avant de s'installer au Canada.
# Past perfect continu
= Sujet + had been + verbe-ing
Pour insister sur la **durée** avant un moment passé.
> I had been waiting for two hours when he finally called. | J'attendais depuis deux heures quand il a enfin appelé.
| Ordre des événements | Phrase
| 1. le train part → 2. j'arrive | When I got to the station, the train had left.
| 1. j'arrive → 2. le train part | When I got to the station, the train left.
? By the time we arrived, they ___ (eat) everything. => had eaten/'d eaten // Action antérieure.
? I didn't recognise her because she ___ (change) so much. => had changed/'d changed // Antériorité.
? He was tired because he ___ (run) for an hour. => had been running/'d been running // Durée avant un moment passé.
* I realised I ___ my wallet at home. [left|had left] => had left // L'oubli est antérieur.
* She ___ there for ten years before she got promoted. [had been working|has been working] => had been working // Durée avant un moment passé.
`},{id:"future-continuous-perfect",lv:4,title:"Futur continu et futur antérieur",en:"Future continuous & future perfect",tense:!0,body:`
# Futur continu : will be + -ing
Action **en cours** à un moment du futur.
> This time tomorrow, I'll be lying on the beach. | Demain à cette heure-ci, je serai allongé sur la plage.
> Will you be using the car tonight? | Tu auras besoin de la voiture ce soir ?
# Futur antérieur : will have + participe passé
Action **terminée avant** un moment du futur.
> By 2030, I will have finished my studies. | D'ici 2030, j'aurai terminé mes études.
> Don't call at 6 — I won't have arrived yet. | N'appelle pas à 6 h, je ne serai pas encore arrivé.
# Futur antérieur continu : will have been + -ing
> By June, I'll have been working here for 10 years. | En juin, cela fera 10 ans que je travaille ici.
! **by** = au plus tard, d'ici. Signal typique du futur antérieur.
? At 9 tonight, I ___ (watch) the match. => will be watching/'ll be watching // En cours à un moment futur.
? By the end of the year, we ___ (save) €5,000. => will have saved/'ll have saved // Terminé avant un moment futur.
? By next month, she ___ (work) here for a year. => will have been working/'ll have been working // Durée jusqu'à un point futur.
* Don't phone between 8 and 9; we ___ dinner. [will have|will be having] => will be having // En cours.
* By the time you get here, I ___ the cake. [will finish|will have finished] => will have finished // Terminé avant.
`},{id:"conditional-3-mixed",lv:4,title:"Conditionnel 3 et conditionnels mixtes",en:"Third & mixed conditionals",tense:!0,body:`
# Conditionnel 3 : regret sur le passé
= If + past perfect, would have + participe passé
> If I had studied, I would have passed the exam. | Si j'avais étudié, j'aurais réussi l'examen.
> If you hadn't helped me, I would have failed. | Si tu ne m'avais pas aidé, j'aurais échoué.
> We wouldn't have got lost if we had taken a map. | On ne se serait pas perdus si on avait pris une carte.
# Conditionnels mixtes
Condition passée → conséquence **présente** :
= If + past perfect, would + verbe (base)
> If I had taken that job, I would be rich now. | Si j'avais accepté ce poste, je serais riche aujourd'hui.
Condition présente → conséquence **passée** :
> If I were braver, I would have told her. | Si j'étais plus courageux, je le lui aurais dit.
| Type | Condition | Conséquence
| 0 | If + présent | présent
| 1 | If + présent | will + base
| 2 | If + prétérit | would + base
| 3 | If + past perfect | would have + participe
x If I would have known… | If I had known…
? If she ___ (leave) earlier, she wouldn't have missed the train. => had left/'d left // Conditionnel 3.
? If I had known you were coming, I ___ (bake) a cake. => would have baked/'d have baked // Conditionnel 3.
? If I had gone to bed earlier, I ___ (not / be) so tired now. => wouldn't be/would not be // Mixte : conséquence présente.
* If we ___ the bus, we would have arrived on time. [caught|had caught] => had caught // If + past perfect.
* If he spoke Spanish, he ___ the job last year. [would get|would have got] => would have got // Mixte : conséquence passée.
`},{id:"reported-speech",lv:4,title:"Le discours indirect",en:"Reported speech",body:`
# Le recul des temps
Quand le verbe introducteur est au passé (**said, told, asked**), on « recule » le temps d'un cran.
| Discours direct | Discours indirect
| présent : "I am tired." | prétérit : She said she was tired.
| présent continu : "I'm working." | passé continu : He said he was working.
| prétérit : "I saw it." | past perfect : She said she had seen it.
| present perfect : "I've finished." | past perfect : He said he had finished.
| will : "I'll come." | would : She said she would come.
| can : "I can help." | could : He said he could help.
| must : "I must go." | had to : She said she had to go.
# Les repères changent aussi
**now → then, today → that day, tomorrow → the next day, yesterday → the day before, here → there, this → that, ago → before**.
# Questions et ordres rapportés
Pas d'inversion dans une question rapportée ; **if / whether** pour les questions fermées.
> "Where do you live?" → He asked me where I lived. | Il m'a demandé où j'habitais.
> "Are you OK?" → She asked if I was OK. | Elle m'a demandé si j'allais bien.
> "Sit down." → He told me to sit down. | Il m'a dit de m'asseoir.
> "Don't shout." → She told us not to shout. | Elle nous a dit de ne pas crier.
x He asked me where did I live. | He asked me where I lived.
? "I like pizza." → She said she ___ pizza. => liked // présent → prétérit.
? "I will call you." → He said he ___ call me. => would // will → would.
? "We have finished." → They said they ___ finished. => had // present perfect → past perfect.
? "Do you speak French?" → She asked me ___ I spoke French. => if/whether // Question fermée.
* "Close the door." → He told me ___ the door. [close|to close|closing] => to close // Ordre → tell + to.
* He asked me where ___. [was the station|the station was] => the station was // Pas d'inversion.
`},{id:"passive-advanced",lv:4,title:"Passif avancé et « have something done »",en:"Advanced passive",body:`
# Le passif à tous les temps
| Temps | Exemple
| présent continu | The road is being repaired.
| passé continu | The room was being cleaned.
| past perfect | The tickets had been sold out.
| infinitif | It needs to be done today.
| gérondif | I hate being interrupted.
# Structures impersonnelles
> It is said that he is a millionaire. / He is said to be a millionaire. | On dit qu'il est millionnaire.
> She is believed to have left the country. | On pense qu'elle a quitté le pays.
# Faire faire : have / get something done
= have / get + objet + participe passé
> I had my hair cut yesterday. | Je me suis fait couper les cheveux hier.
> We're getting the kitchen painted. | Nous faisons repeindre la cuisine.
> He had his car stolen. | Il s'est fait voler sa voiture.
x I cut my hair at the hairdresser's. | I had my hair cut at the hairdresser's.
? The bridge ___ (repair) at the moment. => is being repaired // Passif au présent continu.
? I need to have my eyes ___ (test). => tested // have + objet + participe.
? He is said ___ (be) the best chef in town. => to be // be said to + base.
* She hates ___ told what to do. [being|been|be] => being // Gérondif passif.
* We're going to ___ our house painted. [make|have|do] => have // have something done.
`},{id:"wish",lv:4,title:"Wish / if only (souhaits et regrets)",en:"Wish & if only",tense:!0,body:`
| Structure | Sens | Exemple
| wish + prétérit | regret sur le présent | I wish I had more time. (J'aimerais avoir plus de temps.)
| wish + past perfect | regret sur le passé | I wish I hadn't said that. (Je regrette d'avoir dit ça.)
| wish + would | agacement / souhait de changement | I wish you would stop talking! (Si seulement tu arrêtais !)
| wish + could | capacité souhaitée | I wish I could fly.
> If only I knew the answer! | Si seulement je connaissais la réponse !
> She wishes she had studied medicine. | Elle regrette de ne pas avoir fait médecine.
! Avec be : **I wish I were taller** (were plus soutenu, was accepté à l'oral).
? I wish I ___ (be) on holiday right now. => were/was // Regret présent → prétérit.
? I wish I ___ (not / eat) so much last night. => hadn't eaten/had not eaten // Regret passé.
? I wish it ___ (stop) raining! => would stop // Souhait de changement.
* If only I ___ his number, I could call him. [know|knew|had known] => knew // Regret présent.
* She wishes she ___ to the party yesterday. [went|had gone] => had gone // Regret passé.
`},{id:"modals-past",lv:4,title:"Modaux au passé (should have, must have…)",en:"Past modals",tense:!0,body:`
= Modal + have + participe passé
| Structure | Sens | Exemple
| should have done | reproche / regret | You should have told me. (Tu aurais dû me le dire.)
| shouldn't have done | reproche | I shouldn't have eaten so much.
| must have done | déduction certaine | He must have forgotten. (Il a dû oublier.)
| can't / couldn't have done | impossibilité | She can't have seen us.
| might / may / could have done | possibilité passée | They might have missed the bus.
| could have done | possibilité non réalisée | You could have been killed!
| needn't have done | inutile (mais fait) | You needn't have bought flowers.
> The ground is wet. It must have rained. | Le sol est mouillé. Il a dû pleuvoir.
> I could have won if I had trained more. | J'aurais pu gagner si je m'étais plus entraîné.
? You ___ (should / call) me, I was worried! => should have called // Reproche.
? He isn't answering. He ___ (must / fall) asleep. => must have fallen // Déduction.
? She ___ (can't / write) this; she doesn't speak English. => can't have written/cannot have written // Impossibilité.
* I'm not sure where they are. They ___ the train. [must have missed|might have missed] => might have missed // Simple possibilité.
* You ___ have come — the meeting was cancelled. [needn't|mustn't] => needn't // Inutile.
`},{id:"phrasal-verbs-grammar",lv:4,title:"Les phrasal verbs : mode d'emploi",en:"Phrasal verbs",body:`
# Qu'est-ce que c'est ?
Un verbe + une particule (**up, out, off, on, away, down, back…**) qui change le sens : **give** (donner) → **give up** (abandonner).
# Séparables ou non ?
Beaucoup sont **séparables** : le complément peut se placer avant ou après la particule. Mais si c'est un **pronom**, il se place **obligatoirement au milieu**.
> Turn off the light. / Turn the light off. / Turn it off. | Éteins la lumière.
x Turn off it. | Turn it off.
Certains sont **inséparables** : **look after, get over, come across, run into, look for**.
> She looks after her little brother. | Elle s'occupe de son petit frère.
# Les particules ont souvent un sens
| Particule | Idée | Exemples
| up | achèvement, augmentation | eat up, use up, grow up, speak up
| out | vers l'extérieur, jusqu'au bout | find out, run out, work out
| off | départ, arrêt | take off, turn off, set off, call off
| on | continuité | carry on, go on, keep on
| back | retour | come back, call back, pay back
| down | diminution, écrit | slow down, calm down, write down
? Can you pick ___ the kids from school? => up // pick up = aller chercher.
? We've run ___ of milk. => out // run out of = être à court.
? The match was called ___ because of the rain. => off // call off = annuler.
? Please write it ___ so you don't forget. => down // write down = noter.
* This music is too loud. Can you turn ___? [down it|it down] => it down // Pronom au milieu.
* I'm looking ___ my glasses. Have you seen them? [after|for|up] => for // look for = chercher.
`},{id:"linking-words",lv:4,title:"Les connecteurs logiques",en:"Linking words",body:`
| Idée | Connecteurs | Construction
| Opposition | although, even though, though | + sujet + verbe
| Opposition | despite, in spite of | + nom ou -ing
| Opposition | however, nevertheless | en début de phrase + virgule
| Opposition | whereas, while | contraste entre deux faits
| Cause | because, as, since | + sujet + verbe
| Cause | because of, due to | + nom
| Conséquence | so, therefore, as a result, consequently |
| But | to, in order to, so as to | + base verbale
| But | so that | + sujet + can / could / would
| Addition | moreover, furthermore, in addition, besides |
> Although it was raining, we went out. | Bien qu'il pleuve, nous sommes sortis.
> Despite the rain, we went out. | Malgré la pluie, nous sommes sortis.
> He was ill. However, he went to work. | Il était malade. Pourtant, il est allé travailler.
> I'm learning English in order to work abroad. | J'apprends l'anglais pour travailler à l'étranger.
x Despite it was raining… | Although it was raining… / Despite the rain…
x For to learn… | To learn… / In order to learn…
? ___ being tired, she finished the race. => Despite/In spite of // + -ing.
? ___ he's rich, he isn't happy. => Although/Even though/Though // + sujet + verbe.
? The flight was cancelled ___ the storm. => because of/due to // + nom.
? I'm saving money ___ I can buy a car. => so that // so that + sujet + can.
* I like tea, ___ my wife prefers coffee. [whereas|despite|so that] => whereas // Contraste.
* The project was expensive. ___, it was a success. [Although|However|Despite] => However // Début de phrase + virgule.
`},{id:"quantifiers-advanced",lv:4,title:"Both, either, neither, all, none, each",en:"Quantifiers",body:`
| Mot | Sens | Exemple
| both (… and) | les deux | Both my parents are teachers.
| either (… or) | l'un ou l'autre | You can choose either option.
| neither (… nor) | ni l'un ni l'autre | Neither answer is correct.
| all | tous | All the students passed.
| none (of) | aucun | None of my friends came.
| each | chaque (individuellement) | Each child got a present.
| every | chaque (tous) | I go there every day.
> I like both tea and coffee. | J'aime le thé et le café.
> Neither Tom nor Anna was there. | Ni Tom ni Anna n'étaient là.
> "I don't like it." — "Me neither. / Neither do I." | « Je n'aime pas ça. » — « Moi non plus. »
> "I love it." — "So do I. / Me too." | « J'adore. » — « Moi aussi. »
? "I can't swim." — "___ can I." => Neither/Nor // Moi non plus.
? "I'm hungry." — "___ am I." => So // Moi aussi.
? ___ of my two brothers lives in Paris; they both live in Lyon. => Neither // Aucun des deux.
* You can have ___ cake or ice cream, not both. [either|neither|both] => either // either … or.
* ___ of the guests arrived on time; they were all late. [None|Neither|Nobody] => None // Aucun (plus de deux).
`},{id:"causative-make-let",lv:4,title:"Make, let, allow, get (faire faire, laisser)",en:"Make, let, allow",body:`
| Verbe | Sens | Construction
| make sb do | obliger à / faire faire | My mum made me tidy my room.
| let sb do | laisser faire | My parents let me stay out late.
| allow sb to do | permettre de | We aren't allowed to use phones.
| get sb to do | persuader de | I got him to fix my bike.
> Don't make me laugh! | Ne me fais pas rire !
> Let me help you. | Laisse-moi t'aider.
! **make** et **let** sont suivis de la base sans « to ». Au passif : **I was made to wait** (avec to !).
x She made me to wait. | She made me wait.
x Let me to explain. | Let me explain.
? The teacher made us ___ (rewrite) the essay. => rewrite // make + base.
? They don't allow people ___ (smoke) here. => to smoke // allow + to.
? I finally got my brother ___ (help) me. => to help // get + to.
* My parents never ___ me watch TV at night. [let|allowed|made to] => let // let + base.
* We were made ___ for two hours. [wait|to wait|waiting] => to wait // Passif de make → to.
`}],ts=[{id:"inversion",lv:5,title:"L'inversion (style soutenu)",en:"Inversion",body:`
# Après une expression négative ou restrictive en tête de phrase
On inverse l'**auxiliaire** et le **sujet**, comme dans une question. C'est un style écrit, emphatique.
= Expression négative + auxiliaire + sujet + verbe
| Expression | Exemple
| Never (before) | Never have I seen such a mess.
| Rarely / Seldom | Rarely does he admit he's wrong.
| Not only… but also | Not only did she win, but she also broke the record.
| Hardly / Scarcely… when | Hardly had I arrived when the phone rang.
| No sooner… than | No sooner had we sat down than it started to rain.
| Under no circumstances | Under no circumstances should you open this door.
| Little | Little did they know what was coming.
| Only then / Only when | Only when I left did I realise my mistake.
| Not until | Not until midnight did he come home.
> Never have I been so embarrassed. | Jamais je n'ai été aussi gêné.
# Conditionnels inversés (sans if)
> Had I known, I would have come. (= If I had known) | Si j'avais su, je serais venu.
> Should you need help, call me. (= If you need) | Si vous avez besoin d'aide, appelez-moi.
> Were I in your position, I'd resign. (= If I were) | Si j'étais à votre place, je démissionnerais.
? Never ___ I heard such nonsense! => have // Never + have + sujet + participe.
? Not only ___ he lie, but he also stole money. => did // Prétérit → did.
? ___ I known about the problem, I would have helped. => Had // Had = If I had.
? No sooner ___ she left than he arrived. => had // No sooner had… than.
* Little ___ that he was being watched. [he knew|did he know] => did he know // Little + inversion.
* ___ you have any questions, please contact us. [Should|Would|Had] => Should // Should = If you (should).
`},{id:"cleft-sentences",lv:5,title:"Les phrases clivées (mise en relief)",en:"Cleft sentences",body:`
# It is / was … that / who
Pour insister sur un élément, comme « C'est … qui / que » en français.
> It was Sarah who broke the vase. | C'est Sarah qui a cassé le vase.
> It's in Paris that they met. | C'est à Paris qu'ils se sont rencontrés.
# What… is / was…
> What I need is a holiday. | Ce dont j'ai besoin, c'est de vacances.
> What annoys me is his attitude. | Ce qui m'agace, c'est son attitude.
> What she did was (to) call the police. | Ce qu'elle a fait, c'est appeler la police.
# Autres structures
> All I want is some peace. | Tout ce que je veux, c'est un peu de calme.
> The reason (why) I came is to apologise. | Si je suis venu, c'est pour m'excuser.
> The thing is, I don't have time. | Le problème, c'est que je n'ai pas le temps.
? ___ I don't understand is why he left. => What // Ce que…
? It ___ my brother who told me. => was // It was … who.
? ___ I want is a bit of respect. => All // Tout ce que…
* ___ was in 1969 that man walked on the moon. [It|That|What] => It // It was … that.
* What I love about London ___ the parks. [is|are|it is] => is // What … is.
`},{id:"subjunctive-formal",lv:5,title:"Subjonctif et structures formelles",en:"Subjunctive & formal structures",body:`
# Le subjonctif « mandatif »
Après **suggest, recommend, insist, demand, propose, it is essential / vital / important that**, on utilise la **base verbale** (sans -s), surtout en anglais américain et formel.
> I suggest that he see a doctor. | Je suggère qu'il voie un médecin.
> It is essential that she be informed. | Il est essentiel qu'elle soit informée.
> They insisted that he leave immediately. | Ils ont insisté pour qu'il parte immédiatement.
En anglais britannique, on dit aussi **should** : **I suggest that he should see a doctor.**
# It's (high) time + prétérit
> It's time we went home. | Il est temps que nous rentrions.
> It's high time you found a job. | Il serait grand temps que tu trouves un travail.
# Would rather / had better
> I'd rather you didn't smoke here. | Je préférerais que tu ne fumes pas ici.
> I'd rather stay at home. | Je préfère rester à la maison.
> You'd better leave now. | Tu ferais mieux de partir maintenant.
x I suggest you to go. | I suggest (that) you go. / I suggest going.
? The doctor recommended that she ___ (rest) for a week. => rest // Subjonctif = base.
? It's time you ___ (go) to bed. => went // It's time + prétérit.
? I'd rather you ___ (not / tell) anyone. => didn't tell/did not tell // would rather + sujet + prétérit.
? You'd better ___ (hurry). => hurry // had better + base.
* It is vital that every employee ___ the rules. [follows|follow|will follow] => follow // Subjonctif.
* I'd rather ___ by train. [go|to go|going] => go // would rather + base.
`},{id:"future-advanced",lv:5,title:"Futurs avancés (be about to, be to, be due to)",en:"Advanced future forms",tense:!0,body:`
| Structure | Sens | Exemple
| be about to | sur le point de | The film is about to start.
| be on the point / verge of + -ing | sur le point de | She's on the verge of quitting.
| be to + base | prévu officiellement / ordre | The President is to visit Japan next month.
| be due to + base | prévu (horaire) | The train is due to arrive at 6.
| be bound to | c'est sûr que | It's bound to rain this weekend.
| be likely / unlikely to | probable / improbable | Prices are likely to rise.
# Le futur dans le passé
> I was about to leave when she called. | J'allais partir quand elle a appelé.
> He was going to tell her, but he didn't. | Il allait le lui dire, mais il ne l'a pas fait.
> They were to marry in June, but… | Ils devaient se marier en juin, mais…
? Hurry up! The shop is ___ to close. => about // Sur le point de.
? The plane is ___ to land at 7:15. => due // Horaire prévu.
? Don't worry, she's ___ to call you back — she always does. => bound/sure/certain // C'est sûr.
* You ___ to leave this room without permission! [are not|will not about|are not due] => are not // be to = ordre.
* I ___ going to call you, but I forgot. [am|was|will be] => was // Futur dans le passé.
`},{id:"participle-clauses",lv:5,title:"Les propositions participiales",en:"Participle clauses",body:`
# Raccourcir une phrase
Les participes permettent de condenser deux propositions qui ont le **même sujet**.
| Forme | Sens | Exemple
| -ing (actif, simultané) | Quand / comme… | Walking home, I met an old friend.
| Having + participe (antériorité) | Après avoir… | Having finished her work, she went out.
| participe passé (passif) | Étant… | Built in 1900, the house needs repairs.
> Not knowing what to do, I called my father. | Ne sachant pas quoi faire, j'ai appelé mon père.
> The man sitting next to me was snoring. | L'homme assis à côté de moi ronflait.
> Written in simple English, the book is easy to read. | Écrit en anglais simple, le livre se lit facilement.
! Attention au « participe flottant » : **Walking down the street, a car hit me** veut dire que la voiture marchait !
? ___ (finish) dinner, they went for a walk. => Having finished // Antériorité.
? ___ (feel) tired, she went to bed early. => Feeling // Cause / simultanéité.
? ___ (make) in Italy, these shoes are expensive. => Made // Sens passif.
* The girl ___ to Tom is my sister. [talks|talking|talked] => talking // Participe présent = qui parle.
* ___ the email, he realised he'd made a mistake. [Having sent|Sent|Sending to] => Having sent // Après avoir envoyé.
`},{id:"advanced-articles-nouns",lv:5,title:"Noms composés et articles avancés",en:"Advanced articles & compound nouns",body:`
# The + adjectif = un groupe
> The rich should help the poor. | Les riches devraient aider les pauvres.
> The French drink a lot of wine. | Les Français boivent beaucoup de vin.
# Pas d'article pour les institutions (fonction)
**go to school / church / prison / hospital / bed** : on y va pour la fonction. **the school** = le bâtiment.
> He's in hospital. (UK) | Il est hospitalisé.
> I went to the hospital to visit him. | Je suis allé à l'hôpital pour lui rendre visite.
# Noms composés
Le premier nom joue le rôle d'adjectif et reste au **singulier** : **a toothbrush, a bus stop, a ten-minute walk, a five-year-old boy**.
x a ten-minutes walk | a ten-minute walk
? ___ unemployed need more support. => The // The + adjectif = groupe.
* He was sent to ___ prison for three years. [the|—|a] => — // Institution : pas d'article.
? It's a ___ (two / hour) flight. => two-hour // Nom composé : singulier.
* She's a ___ girl. [six-years-old|six-year-old|six years old] => six-year-old // Adjectif composé.
* I go to ___ bed at 11. [the|—] => — // go to bed.
`},{id:"emphasis-do",lv:5,title:"Insistance : do, so, such, the very",en:"Emphasis",body:`
# Do / does / did d'insistance
> I do like your dress! | J'adore vraiment ta robe !
> He did tell me, I promise. | Il me l'a bien dit, je te le promets.
# So / such
**so + adjectif / adverbe** ; **such (a) + (adjectif) + nom**.
> It was so cold. / It was such a cold day. | Il faisait si froid. / C'était une journée si froide.
> They're such nice people. | Ce sont des gens tellement gentils.
# Intensifieurs
**absolutely** + adjectifs extrêmes (absolutely amazing, freezing, exhausted) ; **very** + adjectifs normaux (very good, cold, tired).
x very exhausted, absolutely tired | absolutely exhausted, very tired
x It was a so good film. | It was such a good film.
? It was ___ a beautiful day that we went to the beach. => such // such a + nom.
? The food was ___ delicious that I had seconds. => so // so + adjectif.
? I ___ (insistance) want to come, but I can't. => do // do d'insistance.
* The film was ___ terrifying. [very|absolutely] => absolutely // Adjectif extrême.
* They have ___ beautiful children. [so|such|such a] => such // such + nom pluriel.
`},{id:"hedging",lv:6,title:"Nuancer son propos (hedging)",en:"Hedging & softening",body:`
# Pourquoi nuancer ?
En anglais (académique, professionnel, diplomatique), affirmer trop directement peut sembler brutal. On adoucit avec des verbes, des modaux et des adverbes.
| Procédé | Exemples
| Verbes | seem, appear, tend to, suggest, indicate
| Modaux | may, might, could, would
| Adverbes | arguably, possibly, presumably, relatively, somewhat
| Expressions | to some extent, it could be argued that, there is some evidence that
> The results seem to suggest a link. | Les résultats semblent indiquer un lien.
> This is arguably his best novel. | C'est sans doute son meilleur roman.
> It would appear that there has been a mistake. | Il semblerait qu'il y ait eu une erreur.
> I'd say it's somewhat expensive. | Je dirais que c'est un peu cher.
# Adoucir une critique ou un refus
> That's not quite what I had in mind. | Ce n'est pas tout à fait ce que j'avais en tête.
> I'm not sure that's the best idea. | Je ne suis pas sûr que ce soit la meilleure idée.
? The data ___ to indicate a slight improvement. => seems/appear/appears/seem // Verbe de prudence.
? It ___ be argued that the policy has failed. => could/might/may // Modal de prudence.
? This is, ___, the most important discovery of the century. => arguably // On peut soutenir que…
* Quelle phrase est la plus nuancée ? [This proves the theory.|This may support the theory.] => This may support the theory. // may + support = prudence.
* « Il semblerait que… » [It would appear that…|It is appearing that…] => It would appear that… // Structure figée.
`},{id:"ellipsis-substitution",lv:6,title:"Ellipse et substitution",en:"Ellipsis & substitution",body:`
# Éviter les répétitions
L'anglais natif évite de répéter : on remplace ou on supprime.
| Procédé | Exemple
| so / not | "Is it going to rain?" — "I hope not." / "I think so."
| one / ones | I don't like the red shirt; I prefer the blue one.
