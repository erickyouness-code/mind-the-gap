| do so | He promised to call, but he didn't do so.
| ellipse après auxiliaire | "Have you finished?" — "Yes, I have."
| ellipse après to | "Do you want to come?" — "I'd love to."
> "Will she come?" — "I'm afraid not." | « Elle viendra ? » — « J'ai bien peur que non. »
> She can speak Russian, but I can't. | Elle sait parler russe, mais pas moi.
> You don't have to come, but you can if you want to. | Tu n'es pas obligé de venir, mais tu peux si tu veux.
? "Is the shop open?" — "I don't think ___." => so // think so / don't think so.
? These shoes are too small. Do you have bigger ___? => ones // Substitution d'un pluriel.
? "Are you coming?" — "I'd like ___, but I can't." => to // Ellipse après to.
* "Did he pass?" — "I'm afraid ___." [no|not|don't] => not // I'm afraid not.
* He said he would apologise, and he did ___. [it|so|that] => so // do so.
`},{id:"advanced-tenses-nuance",lv:6,title:"Nuances temporelles avancées",en:"Advanced tense nuances",tense:!0,body:`
# Le passé pour la distance et la politesse
> I was wondering if you could help me. | Je me demandais si vous pourriez m'aider.
> I wanted to ask you something. | Je voulais vous demander quelque chose.
# Le continu pour l'irritation (always + -ing)
> He's always leaving his socks on the floor! | Il laisse toujours traîner ses chaussettes !
# Le présent de narration (récits, blagues, résumés)
> So this man walks into a bar and orders a drink… | Alors un homme entre dans un bar et commande un verre…
# Le futur de supposition
> That'll be the postman. | Ça doit être le facteur.
> You'll have heard the news, I suppose. | Vous avez sans doute appris la nouvelle.
# Les verbes d'état au continu (changement de sens)
> I'm seeing a doctor tomorrow. (= rendez-vous) | J'ai rendez-vous chez le médecin demain.
> You're being very rude. (= comportement temporaire) | Tu es très impoli en ce moment.
> I'm loving this weather! (familier, enthousiasme) | J'adore ce temps !
? I ___ wondering if you were free on Friday. => was // Passé de politesse.
? She's always ___ (complain) about her job! => complaining // always + -ing = agacement.
? (doorbell) That ___ be Anna — she said she'd come. => will/'ll/must // Futur de supposition.
* Why ___ so difficult today? It's not like you. [are you being|are you] => are you being // Comportement temporaire.
* « Ça doit être le facteur » (on sonne) [That'll be the postman.|That is being the postman.] => That'll be the postman. // will de supposition.
`},{id:"register-style",lv:6,title:"Registres : formel, neutre, familier",en:"Register & style",body:`
| Familier | Neutre | Formel
| get | receive / obtain | acquire
| ask for | request | solicit
| find out | discover | ascertain
| put off | postpone | defer
| need | require | necessitate
| help | assist | facilitate
| enough | sufficient | adequate
| buy | purchase | procure
| tell | inform | notify
| about | approximately | circa
# Courriels formels
> I am writing to enquire about… | Je vous écris pour me renseigner sur…
> Please find attached… | Veuillez trouver ci-joint…
> I would be grateful if you could… | Je vous serais reconnaissant de bien vouloir…
> I look forward to hearing from you. | Dans l'attente de votre réponse.
> Yours sincerely / Yours faithfully | Cordialement / Veuillez agréer…
! **Yours faithfully** quand on ne connaît pas le nom (Dear Sir or Madam) ; **Yours sincerely** quand on le connaît (Dear Mr Smith).
# Familier
> gonna, wanna, gotta, kinda, ain't, y'all, cheers, mate | (à réserver à l'oral entre amis)
? (formel) We need to ___ the meeting until next week. (put off) => postpone/defer // Registre plus soutenu.
? I would be ___ if you could send me the details. => grateful // Formule de politesse.
? I look forward to ___ from you. => hearing // look forward to + -ing.
* Dear Sir or Madam, … Yours ___ [sincerely|faithfully] => faithfully // Destinataire inconnu.
* Version la plus formelle de « find out » : [discover|ascertain|get to know] => ascertain // Registre soutenu.

# Les mots qui vont ensemble
Une collocation est une association naturelle de mots. Les natifs ne disent pas « strong rain » mais **heavy rain**.
| Correct | Incorrect | Français
| heavy rain / traffic | strong rain | forte pluie, circulation dense
| strong coffee / wind | powerful coffee | café fort
| make a mistake | do a mistake | faire une erreur
| take a photo | make a photo | prendre une photo
| pay attention | give attention | faire attention
| catch a cold | take a cold | attraper un rhume
| a high price | an expensive price | un prix élevé
| commit a crime | make a crime | commettre un crime
| deeply regret | strongly regret | regretter profondément
| bitterly disappointed | strongly disappointed | amèrement déçu
| fast asleep / wide awake | — | profondément endormi / bien réveillé
| highly unlikely | strongly unlikely | très improbable
? There was ___ traffic on the motorway. => heavy // heavy traffic.
? Can you ___ a photo of us? => take // take a photo.
? It's highly ___ that he'll win. => unlikely // highly unlikely.
? The baby is fast ___. => asleep // fast asleep.
* She was bitterly ___ by the result. [disappointing|disappointed|sad] => disappointed // bitterly disappointed.
* He ___ a terrible crime. [made|did|committed] => committed // commit a crime.

taying at home.","On a fini par rester à la maison.",3],["fall out","se brouiller","They fell out over money.","Ils se sont brouillés pour une histoire d'argent.",4],["go through","traverser (une épreuve) / examiner","She's going through a difficult time.","Elle traverse une période difficile.",4],["hold on","patienter","Hold on a minute, please.","Patientez une minute, s’il vous plaît.",3],["let down","décevoir, laisser tomber","Don't let me down.","Ne me laisse pas tomber.",4],["make out","distinguer / comprendre","I couldn't make out what he was saying.","Je n'arrivais pas à comprendre ce qu'il disait.",5],["pull through","s'en sortir (maladie)","The doctors think he'll pull through.","Les médecins pensent qu'il va s'en sortir.",5],["rule out","exclure (une possibilité)","The police have ruled out murder.","La police a exclu l’hypothèse du meurtre.",5],["set up","créer, monter, installer","She set up her own company.","Elle a monté sa propre entreprise.",4],["sort out","régler, arranger","Let's sort this out.","Réglons ça.",4],["take over","prendre le contrôle, reprendre","A big company took over the firm.","Une grande entreprise a racheté la société.",4],["take up","commencer (une activité) / prendre (place)","I’ve taken up yoga.","Je me suis mis au yoga.",4],["turn out","s'avérer","It turned out to be a great idea.","Ça s'est avéré être une super idée.",4],["wear out","user / épuiser","These shoes are worn out.","Ces chaussures sont usées.",4],["brush up on","rafraîchir (ses connaissances)","I need to brush up on my English.","Je dois rafraîchir mon anglais.",5],["iron out","aplanir (des difficultés)","We need to iron out a few details.","Il faut régler quelques détails.",6],["fob off","se débarrasser de (avec une excuse)","Don't let them fob you off with excuses.","Ne les laisse pas te balader avec des excuses.",6],["gloss over","passer sous silence, minimiser","The report glosses over the main problems.","Le rapport passe sous silence les principaux problèmes.",6],["hinge on","dépendre entièrement de","Everything hinges on his decision.","Tout dépend de sa décision.",6],["stave off","repousser, éviter","They ate biscuits to stave off hunger.","Ils ont mangé des biscuits pour tromper la faim.",6],["weigh up","peser (le pour et le contre)","Weigh up the pros and cons.","Pèse le pour et le contre.",5],["zero in on","se concentrer sur, cibler","The team zeroed in on the problem.","L'équipe s'est concentrée sur le problème.",6]],Xe=[["It's raining cats and dogs.","Il pleut des cordes.","Take an umbrella — it’s raining cats and dogs!",3],["Break a leg!","Bonne chance ! (merde !)","Your exam is today? Break a leg!",3],["a piece of cake","du gâteau, très facile","The test was a piece of cake.",2],["to cost an arm and a leg","coûter les yeux de la tête","This phone cost an arm and a leg.",3],["to be under the weather","ne pas être dans son assiette","I'm feeling a bit under the weather today.",3],["to hit the sack","aller se coucher","I'm exhausted, I'm going to hit the sack.",4],["to spill the beans","vendre la mèche","Who spilled the beans about the party?",4],["to let the cat out of the bag","vendre la mèche","Don't let the cat out of the bag!",4],["once in a blue moon","tous les 36 du mois","I only see him once in a blue moon.",4],["to break the ice","briser la glace","He told a joke to break the ice.",3],["to call it a day","s'arrêter là pour aujourd'hui","It's late. Let's call it a day.",4],["to get cold feet","se dégonfler","He got cold feet before the wedding.",4],["to kill two birds with one stone","faire d'une pierre deux coups","I killed two birds with one stone.",4],["to pull someone’s leg","faire marcher quelqu’un","Relax, I'm just pulling your leg!",4],["to be on cloud nine","être aux anges","She’s been on cloud nine since she got the job.",4],["to bite off more than you can chew","avoir les yeux plus gros que le ventre","I think I’ve bitten off more than I can chew.",5],["the last straw","la goutte d’eau qui fait  announcing her news first.",6],["a blessing in disguise","un mal pour un bien","Losing that job was a blessing in disguise.",5],["to add insult to injury","pour couronner le tout","To add insult to injury, it started raining.",6],["to play devil’s advocate","se faire l'avocat du diable","Let me play devil's advocate for a moment.",5],["to be on the same page","être d’accord, sur la même longueur d’onde","Let’s make sure we’re all on the same page.",4],["to get the hang of something","prendre le coup de main","You'll soon get the hang of it.",4],["no pain, no gain","on n'a rien sans rien","Keep training — no pain, no gain!",3],["to feel blue","avoir le cafard","I'm feeling a bit blue today.",3],["to know something inside out","connaître quelque chose par cœur","She knows the city inside out.",4],["in the nick of time","juste à temps","We arrived in the nick of time.",5],["to throw in the towel","jeter l’éponge","Don't throw in the towel yet!",5],["a far cry from","très loin de","This hotel is a far cry from the photos.",6],["to rest on your laurels","se reposer sur ses lauriers","Don't rest on your laurels.",6],["the elephant in the room","le sujet tabou que tout le monde évite","Let's talk about the elephant in the room.",5]],qt=[{id:"greetings",title:"Saluer et se présenter",icon:"wave",lv:1,phrases:[["Hi! / Hello!","Salut ! / Bonjour !"],["Good morning / afternoon / evening.","Bonjour (matin) / bon après-midi / bonsoir."],["How are you? — I’m fine, thanks. And you?","Comment vas-tu ? — Bien, merci. Et toi ?"],["How's it going?","Ça va ?"],["What's your name? — My name is…","Comment t'appelles-tu ? — Je m'appelle…"],["Nice to meet you.","Enchanté(e)."],["Where are you from? — I’m from France.","D'où viens-tu ? — Je viens de France."],["What do you do (for a living)?","Que fais-tu dans la vie ?"],["See you later! / See you soon!","À plus tard ! / À bientôt !"],["Have a nice day!","Bonne journée !"],["Take care!","Prends soin de toi !"],["Long time no see!","Ça fait longtemps !"]],dialogue:[["A","Hi, I’m Sam. Nice to meet you.","Salut, je suis Sam. Enchanté."],["B","Nice to meet you too. I’m Léa.","Enchantée aussi. Moi c’est Léa."],["A","Where are you from, Léa?","D'où viens-tu, Léa ?"],["B","I'm from Lyon, in France. And you?","Je viens de Lyon, en France. Et toi ?"],["A","I'm from Manchester. Are you here on holiday?","Je viens de Manchester. Tu es en vacances ici ?"],["B","No, I'm here to study English.","Non, je suis ici pour apprendre l'anglais."]]},{id:"restaurant",title:"Au restaurant / au café",icon:"food",lv:1,phrases:[["A table for two, please.","Une table pour deux, s’il vous plaît."],["Could I see the menu, please?","Je pourrais voir la carte, s’il vous plaît ?"],["I'd like the chicken, please.","Je voudrais le poulet, s’il vous plaît."],["What do you recommend?","Que me conseillez-vous ?"],["I'm allergic to nuts.","Je suis allergique aux fruits à coque."],["Could I have some water, please?","Je pourrais avoir de l'eau, s’il vous plaît ?"],["Is service included?","Le service est-il compris ?"],["Could we have the bill, please? (UK) / the check (US)","L'addition, s’il vous plaît."],["Can I pay by card?","Je peux payer par carte ?"],["To eat in or take away?","Sur place ou à emporter ?"],["Medium-rare / well done, please.","À point / bien cuit, s’il vous plaît."],["It was delicious, thank you!","C'était délicieux, merci !"]],dialogue:[["W","Are you ready to order?","Vous avez choisi ?"],["C","Yes, I'll have the fish and chips, please.","Oui, je prendrai le fish and chips, s’il vous plaît."],["W","Anything to drink?","Quelque chose à boire ?"],["C","Just a glass of sparkling water, please.","Juste un verre d'eau pétillante, s’il vous plaît."],["W","Would you like a dessert?","Voulez-vous un dessert ?"],["C","No thanks, just the bill, please.","Non merci, juste l'addition, s’il vous plaît."]]},{id:"directions",title:"Demander son chemin",icon:"map",lv:1,phrases:[["Excuse me, where is the station?","Excusez-moi, où est la gare ?"],["How do I get to the city centre?","Comment je vais au centre-ville ?"],["Is it far from here?","C'est loin d'ici ?"],["It's a five-minute walk.","C'est à cinq minutes à pied."],["Go straight on.","Allez tout droit."],["Turn left / right.","Tournez à gauche / à droite."],["Take the second street on the left.","Prenez la deuxième rue à gauche."],["It's next to / opposite / between…","C'est à côté de / en face de / entre…"],["at the traffic lights / at the roundabout","au feu / au rond-point"],["Sorry, I'm not from around here.","Désolé, je ne suis pas d'ici."]]},{id:"shopping",title:"Faire du shopping",icon:"bag",lv:2,phrases:[["How much is it? / How much does it cost?","Combien ça coûte ?"],["I'm just looking, thanks.","Je regarde seulement, merci."],["Do you have this in a smaller / bigger size?","Vous l’avez en plus petit / plus grand ?"],["Can I try it on?","Je peux l’essayer ?"],["Where are the changing rooms?","Où sont les cabines d’essayage ?"],["It's too expensive.","C'est trop cher."],["I'll take it.","Je le prends."],["Can I get a refund?","Je peux être remboursé ?"],["Do you have a receipt?","Vous avez le ticket de caisse ?"],["Is it on sale?","Est-ce que c’est en promotion ?"]]},{id:"travel",title:"Voyager : aéroport, hôtel, transports",icon:"plane",lv:2,phrases:[["I have a reservation under the name…","J'ai une réservation au nom de…"],["What time is check-out?","À quelle heure faut-il libérer la chambre ?"],["A single / return ticket to London, please.","Un aller simple / aller-retour pour Londres, s’il vous plaît."],["Which platform does the train leave from?","De quel quai part le train ?"],["My flight has been delayed / cancelled.","Mon vol a été retardé / annulé."],["Where is the baggage claim?","Où est le retrait des bagages ?"],["My luggage has been lost.","Mes bagages ont été perdus."],["Window or aisle seat?","Côté hublot ou couloir ?"],["Is breakfast included?","Le petit-déjeuner est-il compris ?"],["The air conditioning doesn’t work.","La climatisation ne marche pas."],["Could you call me a taxi?","Pourriez-vous m'appeler un taxi ?"],["Do I need to change trains?","Dois-je changer de train ?"]],dialogue:[["R","Good evening. How can I help you?","Bonsoir. Que puis-je pour vous ?"],["G","Hi, I've booked a double room for three nights. The name's Martin.","Bonsoir, j'ai réservé une chambre double pour trois nuits. Au nom de Martin."],["R","Ah yes, Mr Martin. Could I see your passport, please?","Ah oui, M. Martin. Puis-je voir votre passeport ?"],["G","Here you are. What time is breakfast?","Voici. À quelle heure est le petit-déjeuner ?"],["R","From 7 to 10 in the dining room. Here's your key card — room 214.","De 7 h à 10 h en salle. Voici votre carte — chambre 214."]]},{id:"doctor",title:"Chez le médecin / à la pharmacie",icon:"health",lv:2,phrases:[["I don't feel well.","Je ne me sens pas bien."],["I have a headache / a sore throat / a stomach ache.","J'ai mal à la tête / à la gorge / au ventre."],["I've got a temperature / a fever.","J'ai de la fièvre."],["I'm allergic to penicillin.","Je suis allergique à la pénicilline."],["I need to make an appointment.","J'ai besoin de prendre rendez-vous."],["How long have you had these symptoms?","Depuis combien de temps avez-vous ces symptômes ?"],["Take two tablets three times a day.","Prenez deux comprimés trois fois par jour."],["Do I need a prescription?","Ai-je besoin d'une ordonnance ?"],["It hurts here.","J'ai mal ici."],["Call an ambulance!","Appelez une ambulance !"]]},{id:"phone",title:"Au téléphone",icon:"phone",lv:2,phrases:[["Hello, this is Paul speaking.","Allô, c'est Paul."],["Could I speak to Ms Brown, please?","Pourrais-je parler à Mme Brown ?"],["Hold on, please. / Hold the line.","Ne quittez pas."],["I'll put you through.","Je vous la passe."],["She's not available at the moment.","Elle n'est pas disponible pour le moment."],["Can I take a message?","Puis-je prendre un message ?"],["Could you speak more slowly, please?","Pourriez-vous parler plus lentement ?"],["Sorry, the line is bad. I can't hear you.","Désolé, la ligne est mauvaise. Je ne vous entends pas."],["I'll call you back.","Je te rappelle."],["Could you spell that, please?","Pourriez-vous épeler, s’il vous plaît ?"]]},{id:"work",title:"Au travail et en réunion",icon:"work",lv:3,phrases:[["Let's get started.","Commençons."],["Let's move on to the next point.","Passons au point suivant."],["Could you elaborate on that?","Pourriez-vous développer ?"],["I see your point, but…","Je comprends votre point de vue, mais…"],["I'm afraid I disagree.","Je crains de ne pas être d'accord."],["Can we schedule a follow-up meeting?","Pouvons-nous prévoir une réunion de suivi ?"],["What's the deadline?","Quelle est l'échéance ?"],["I'll get back to you on that.","Je reviens vers vous à ce sujet."],["Just to clarify…","Juste pour clarifier…"],["To sum up…","Pour résumer…"],["Sorry to interrupt, but…","Désolé de vous interrompre, mais…"],["Could you send me the minutes?","Pourriez-vous m’envoyer le compte rendu ?"]]},{id:"interview",title:"Entretien d'embauche",icon:"tie",lv:3,phrases:[["Tell me about yourself.","Parlez-moi de vous."],["Why do you want to work here?","Pourquoi voulez-vous travailler ici ?"],["What are your strengths and weaknesses?","Quels sont vos points forts et vos points faibles ?"],["Where do you see yourself in five years?","Où vous voyez-vous dans cinq ans ?"],["I have five years' experience in marketing.","J'ai cinq ans d'expérience en marketing."],["I'm a quick learner and a team player.","J'apprends vite et j'aime travailler en équipe."],["I was responsible for managing a team of ten.","J'étais responsable d'une équipe de dix personnes."],["What would a typical day look like?","À quoi ressemblerait une journée type ?"],["When can you start?","Quand pouvez-vous commencer ?"],["Do you have any questions for us?","Avez-vous des questions ?"]]},{id:"opinions",title:"Donner son avis, débattre",icon:"chat",lv:3,phrases:[["In my opinion… / I think… / I believe…","À mon avis… / Je pense… / Je crois…"],["As far as I’m concerned…","En ce qui me concerne…"],["I totally agree.","Je suis tout à fait d'accord."],["That’s a good point.","C'est un bon argument."],["I'm not so sure about that.","Je n'en suis pas si sûr."],["On the one hand… on the other hand…","D'un côté… de l'autre…"],["It depends.","Ça dépend."],["I couldn't agree more.","Je suis entièrement d’accord."],["That's not what I meant.","Ce n'est pas ce que je voulais dire."],["Let me put it another way.","Laissez-moi le dire autrement."]]},{id:"smalltalk",title:"Small talk (conversation légère)",icon:"coffee",lv:3,phrases:[["Lovely weather today, isn’t it?","Il fait beau aujourd’hui, hein ?"],["Did you have a good weekend?","Tu as passé un bon week-end ?"],["Any plans for the holidays?","Des projets pour les vacances ?"],["How do you know the host?","Comment connais-tu l'hôte ?"],["What have you been up to lately?","Qu'est-ce que tu deviens ?"],["I know what you mean.","Je vois ce que tu veux dire."],["Fair enough.","Ça se tient. / D’accord."],["No way! / Really?","Sans blague ! / Vraiment ?"],["Anyway, it was great talking to you.","Bref, ravi d’avoir discuté avec toi."],["Let's keep in touch.","Restons en contact."]]},{id:"emails",title:"Écrire un e-mail",icon:"mail",lv:4,phrases:[["Dear Mr / Ms Smith,","Monsieur / Madame Smith,"],["I hope this email finds you well.","J'espère que vous allez bien."],["I am writing to inquire about…","Je vous écris pour me renseigner sur…"],["Further to our conversation…","Suite à notre conversation…"],["Please find attached…","Veuillez trouver ci-joint…"],["Could you please confirm…?","Pourriez-vous confirmer… ?"],["I apologise for the delay in replying.","Je vous prie de m’excuser pour ce retard de réponse."],["Do not hesitate to contact me if you have any questions.","N'hésitez pas à me contacter si vous avez des questions."],["I look forward to hearing from you.","Dans l’attente de votre réponse."],["Kind regards, / Best wishes,","Cordialement, / Bien à vous,"]]},{id:"emergencies",title:"Urgences et problèmes",icon:"alert",lv:2,phrases:[["Help!","Au secours !"],["Call the police!","Appelez la police !"],["I’ve lost my passport.","J'ai perdu mon passeport."],["My wallet has been stolen.","On m’a volé mon portefeuille."],["There's been an accident.","Il y a eu un accident."],["Where is the nearest hospital?","Où est l'hôpital le plus proche ?"],["Is there anyone who speaks French?","Y a-t-il quelqu'un qui parle français ?"],["Fire! Get out!","Au feu ! Sortez !"],["I need help.","J'ai besoin d'aide."],["I’m lost.","Je suis perdu(e)."]]}],js=[{title:"Le « th » : /θ/ et /ð/",text:"Placez la pointe de la langue entre les dents et soufflez. /θ/ est sourd (sans vibration), /ð/ est sonore (avec vibration des cordes vocales). Ne le remplacez ni par « s », ni par « z », ni par « f ».",examples:[["think, three, thank, bath","/θ/ sourd"],["this, that, mother, the","/ð/ sonore"],["I think this is the third thing.","phrase d’entraînement"]]},{title:"Le « h » aspiré",text:"En anglais, le h se prononce presque toujours : expirez comme pour faire de la buée sur une vitre. Sauf dans hour, honest, honour, heir.",examples:[["hello, house, happy, hotel","h prononcé"],["an hour, an honest man","h muet"],["Harry has a horrible headache.","phrase d’entraînement"]]},{title:"Voyelles courtes et longues",text:"La durée de la voyelle change le sens. /ɪ/ est court et relâché, /iː/ est long et tendu.",examples:[["ship / sheep","/ɪ/ vs /iː/"],["live / leave","/ɪ/ vs /iː/"],["full / fool","/ʊ/ vs /uː/"],["cat / cut / cart","/æ/ vs /ʌ/ vs /ɑː/"]]},{title:"Les terminaisons -ed",text:"/t/ après un son sourd (p, k, f, s, sh, ch), /d/ après un son sonore, /ɪd/ seulement après t ou d. Ne prononcez pas « é-d » partout !",examples:[["walked, stopped, laughed","/t/"],["played, called, opened","/d/"],["wanted, needed, decided","/ɪd/"]]},{title:"Les terminaisons -s",text:"/s/ après un son sourd, /z/ après
